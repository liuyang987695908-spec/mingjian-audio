ech": "第 20 条，国务院安委办约谈11个市级政府。这条来自抖音热点。", "chars": 32, "start": 166.27}, {"title": "何超琼称「不是让一百个人来澳门一次，而是希望一个人来一百次」，如何看待这一旅游发展理念", "body": "这条来自知乎热榜。", "speech": "第 21 条，何超琼称「不是让一百个人来澳门一次，而是希望一个人来一百次」，如何看待这一旅游发展理念。这条来自知乎热榜。", "chars": 60, "start": 173.3}, {"title": "国防部再批日本右翼势力", "body": "这条来自抖音热点。", "speech": "第 22 条，国防部再批日本右翼势力。这条来自抖音热点。", "chars": 28, "start": 185.42}], "seconds": 194.5, "rate": "+0%", "file": "https://cdn.jsdelivr.net/gh/liuyang987695908-spec/mingjian-audio@main/audio/2026-11-14/hot.mp3?v=20261114080219", "backup": "audio/2026-11-14/hot.mp3?v=20261114080219"}, {"key": "geo", "name": "地理", "emoji": "🗺️", "count": 10, "items": [{"title": "四川，到底有啥好的", "body": "提起四川，你会想到什么呢？是“实现熊猫自由”的天府之国，还是大街小巷的麻辣鲜香，峨眉山、九寨沟、黄龙、若尔盖、稻城亚丁、泸沽湖.....在舌尖和眼球的双重刺激下，不忘再补上一句：四川，真的很巴适！都说四川好，但是四川到底好在哪里呢？在中国地形三大阶梯中，四川恰好位于第一级—青藏高原和第三级—长江中下游平原的过。这条来自中国国家地理。", "speech": "第 1 条，四川，到底有啥好的。提起四川，你会想到什么呢？是“实现熊猫自由”的天府之国，还是大街小巷的麻辣鲜香，峨眉山、九寨沟、黄龙、若尔盖、稻城亚丁、泸沽湖.....在舌尖和眼球的双重刺激下，不忘再补上一句：四川，真的很巴适！都说四川好，但是四川到底好在哪里呢？在中国地形三大阶梯中，四川恰好位于第一级—青藏高原和第三级—长江中下游平原的过。这条来自中国国家地理。", "chars": 183, "start": 3.62}, {"title": "黄河不黄了？是真的", "body": "在人们的印象中，黄河一直以含沙量高著称。自高原山地飞驰而下，黄河裹挟大量泥沙，在入海口淤积造就了大片陆地。与此同时，黄河中游失去了大量的肥沃土地和水资源，下游及其相邻地区也频繁遭受洪水灾害。黄河水是“黄”还是“清”，从古至今一直备受关注。如今，黄河真的不黄了。根据《2021中国河流泥沙公报》显示，黄河流域代表。", "speech": "第 2 条，黄河不黄了？是真的。在人们的印象中，黄河一直以含沙量高著称。自高原山地飞驰而下，黄河裹挟大量泥沙，在入海口淤积造就了大片陆地。与此同时，黄河中游失去了大量的肥沃土地和水资源，下游及其相邻地区也频繁遭受洪水灾害。黄河水是“黄”还是“清”，从古至今一直备受关注。如今，黄河真的不黄了。根据《2021中国河流泥沙公报》显示，黄河流域代表。", "chars": 172, "start": 42.0}, {"title": "“三重”拉尼娜，这个冬天会是“冷冬”吗", "body": "不久前联合国世界气象组织（WMO）预计当前拉尼娜事件，将持续至2022年冬季，这将是21世纪首次出现的“三重”拉尼娜现象。 什么是拉尼娜？“三重”拉尼娜 将对我国今冬天气造成哪些影响？周兵： 首先拉尼娜是指赤道中、东太平洋海表温度异常，出现大范围偏冷、且强度和持续时间达到一定条件的冷水现象。它属于自然现象，理。", "speech": "第 3 条，“三重”拉尼娜，这个冬天会是“冷冬”吗。不久前联合国世界气象组织（WMO）预计当前拉尼娜事件，将持续至2022年冬季，这将是21世纪首次出现的“三重”拉尼娜现象。 什么是拉尼娜？“三重”拉尼娜 将对我国今冬天气造成哪些影响？周兵： 首先拉尼娜是指赤道中、东太平洋海表温度异常，出现大范围偏冷、且强度和持续时间达到一定条件的冷水现象。它属于自然现象，理。", "chars": 182, "start": 79.75}, {"title": "盐城黄海湿地——落潮留痕沙洲如画", "body": "在我国的黄海南部，有一片湿地——江苏盐城黄海湿地，目前不仅是世界上最大的海岸型湿地，也是世界上面积最大的辐射沙洲群。发布时间：2020年06月01日 文章出自：用户投稿 作者： 严正东。2019年7月5日，盐城黄海湿地（申报名称为“中国黄（渤）海候鸟栖息地（第一期）”）被列入世界自然遗产名录。）。真的想象不出。", "speech": "第 4 条，盐城黄海湿地——落潮留痕沙洲如画。在我国的黄海南部，有一片湿地——江苏盐城黄海湿地，目前不仅是世界上最大的海岸型湿地，也是世界上面积最大的辐射沙洲群。发布时间：2020年06月01日 文章出自：用户投稿 作者： 严正东。2019年7月5日，盐城黄海湿地（申报名称为“中国黄（渤）海候鸟栖息地（第一期）”）被列入世界自然遗产名录。）。真的想象不出。", "chars": 179, "start": 117.84}, {"title": "中国第一条民营铁路——个碧石铁路", "body": "发布时间：2020年01月06日 文章出自：用户投稿 作者： 赵艳青。她是全国轨距最窄的铁路；她是全国筑路时间最长的铁路；她是效益最显著的铁路；她是百年个碧石铁路！个碧石铁路是中国最早修筑的铁路之一，是中国唯一一条民营铁路，也是中国唯一一条轨距六十厘米的铁路。话说一九零三年，浪漫的法国人带着不浪漫的热兵器，气。", "speech": "第 5 条，中国第一条民营铁路——个碧石铁路。发布时间：2020年01月06日 文章出自：用户投稿 作者： 赵艳青。她是全国轨距最窄的铁路；她是全国筑路时间最长的铁路；她是效益最显著的铁路；她是百年个碧石铁路！个碧石铁路是中国最早修筑的铁路之一，是中国唯一一条民营铁路，也是中国唯一一条轨距六十厘米的铁路。话说一九零三年，浪漫的法国人带着不浪漫的热兵器，气。", "chars": 179, "start": 154.15}, {"title": "行走在邓家围屋，静听岁月的轻语", "body": "关于围屋，有讲不完的故事，写不完的诗。围屋，就像一个散落的城堡，在乡村，静静地矗立，默默地遥望。随着经济社会的快速发展，城镇化愈演愈烈，新宅在建，围屋在守望。发布时间：2019年05月13日 文章出自：用户投稿 作者： 杜建群。初夏的的午后，我寻寻觅觅，遇见了你清晰的纹路。你无声又无言，却告诉我那曾经的过往。", "speech": "第 6 条，行走在邓家围屋，静听岁月的轻语。关于围屋，有讲不完的故事，写不完的诗。围屋，就像一个散落的城堡，在乡村，静静地矗立，默默地遥望。随着经济社会的快速发展，城镇化愈演愈烈，新宅在建，围屋在守望。发布时间：2019年05月13日 文章出自：用户投稿 作者： 杜建群。初夏的的午后，我寻寻觅觅，遇见了你清晰的纹路。你无声又无言，却告诉我那曾经的过往。", "chars": 177, "start": 191.38}, {"title": "重庆：世界上唯一建在平行岭谷的大城市", "body": "重庆人向外地人介绍重庆时，常会略带几分自豪地用方言说“我们这里是山城”，而且还要将“山”字狠狠地拖出一个尾音来才过瘾。对于重庆人来说，爬坡上坎是再寻常不过的事情。在这里坐轻轨有着过山车一般的体验，这里的九楼换个面就是一楼……发布时间：2018年08月29日 文章出自：用户投稿 作者： 彭怀月。中国这么大，有山。", "speech": "第 7 条，重庆：世界上唯一建在平行岭谷的大城市。重庆人向外地人介绍重庆时，常会略带几分自豪地用方言说“我们这里是山城”，而且还要将“山”字狠狠地拖出一个尾音来才过瘾。对于重庆人来说，爬坡上坎是再寻常不过的事情。在这里坐轻轨有着过山车一般的体验，这里的九楼换个面就是一楼……发布时间：2018年08月29日 文章出自：用户投稿 作者： 彭怀月。中国这么大，有山。", "chars": 181, "start": 229.42}, {"title": "琥珀，带你穿越至远古的宝石", "body": "琥珀，也称虎魄，在传说中是一种由老虎魂魄结晶而成的宝石。数千万年的时光冲刷洗礼，让它绽放出神秘而温润的光芒。它的神秘与美丽，让世人赋予了许多传奇色彩，甚至于有一种颜色，是直接以琥珀命名的。发布时间：2019年11月05日 文章出自：用户投稿 作者： 田庄。从东半球的中国辽宁，到西半球的美国新泽西，从冰天雪地的。", "speech": "第 8 条，琥珀，带你穿越至远古的宝石。琥珀，也称虎魄，在传说中是一种由老虎魂魄结晶而成的宝石。数千万年的时光冲刷洗礼，让它绽放出神秘而温润的光芒。它的神秘与美丽，让世人赋予了许多传奇色彩，甚至于有一种颜色，是直接以琥珀命名的。发布时间：2019年11月05日 文章出自：用户投稿 作者： 田庄。从东半球的中国辽宁，到西半球的美国新泽西，从冰天雪地的。", "chars": 176, "start": 266.42}, {"title": "山南秘境勒布沟", "body": "如今去西藏已经不是难事儿，走过川藏线，赏过林芝桃花，朝圣过阿里神山，墙裂推荐大家去看看被遗忘的山南秘境这座藏源之地，有着国境线的喜马拉雅之南，竟然深藏着壮美的雪山，高山瀑布、鲜花满山的绝美风光。发布时间：2019年07月17日 文章出自：用户投稿 作者： 胡澍。当然除了秘境之外也有必备的打卡之地藏王第一宫雍布。", "speech": "第 9 条，山南秘境勒布沟。如今去西藏已经不是难事儿，走过川藏线，赏过林芝桃花，朝圣过阿里神山，墙裂推荐大家去看看被遗忘的山南秘境这座藏源之地，有着国境线的喜马拉雅之南，竟然深藏着壮美的雪山，高山瀑布、鲜花满山的绝美风光。发布时间：2019年07月17日 文章出自：用户投稿 作者： 胡澍。当然除了秘境之外也有必备的打卡之地藏王第一宫雍布。", "chars": 170, "start": 304.13}, {"title": "井盐与诺邓村", "body": "井盐，食盐的一种。诺邓村，又名诺邓井。井盐，从盐井汲取盐卤,设灶煎制而成。发布时间：2021年04月07日 文章出自：用户投稿 作者： 赵艳青。诺邓古村深藏于云南省大理州云龙县城北的大山中，是有着上千年厚重过往的白族村寨，村庄因盐业而生，因盐业而兴，长期煮盐贩盐，曾一度是滇西地区的经济重镇。西汉至南北朝时期。", "speech": "第 10 条，井盐与诺邓村。井盐，食盐的一种。诺邓村，又名诺邓井。井盐，从盐井汲取盐卤,设灶煎制而成。发布时间：2021年04月07日 文章出自：用户投稿 作者： 赵艳青。诺邓古村深藏于云南省大理州云龙县城北的大山中，是有着上千年厚重过往的白族村寨，村庄因盐业而生，因盐业而兴，长期煮盐贩盐，曾一度是滇西地区的经济重镇。西汉至南北朝时期。", "chars": 169, "start": 339.84}], "seconds": 379.6, "rate": "+0%", "file": "https://cdn.jsdelivr.net/gh/liuyang987695908-spec/mingjian-audio@main/audio/2026-11-14/geo.mp3?v=20261114080219", "backup": "audio/2026-11-14/geo.mp3?v=20261114080219"}, {"key": "history", "name": "历史", "emoji": "🏛️", "count": 12, "items": [{"title": "“中国”概念内涵在清代的拓展", "body": "“中国”作为一个承载着数千年历史记忆、文化传承与疆域认同的核心概念，其内涵随着历代王朝的更迭、疆域的拓展与民族融合的深化而不断演进，但始终保持着内在的历史连续性与文化同一性。自先秦时期产生“中国”概念以来，历经秦汉大一统王朝的定型、隋唐宋元的拓展，至明清时期逐步演变为涵盖多民族、广疆域的统一主权国家概念，这一。这条来自中国社会科学网·历史学。", "speech": "第 1 条，“中国”概念内涵在清代的拓展。“中国”作为一个承载着数千年历史记忆、文化传承与疆域认同的核心概念，其内涵随着历代王朝的更迭、疆域的拓展与民族融合的深化而不断演进，但始终保持着内在的历史连续性与文化同一性。自先秦时期产生“中国”概念以来，历经秦汉大一统王朝的定型、隋唐宋元的拓展，至明清时期逐步演变为涵盖多民族、广疆域的统一主权国家概念，这一。这条来自中国社会科学网·历史学。", "chars": 193, "start": 3.86}, {"title": "诸葛亮去世后，家族的后人都去哪了", "body": "临终前，他最放不下的除了北伐，还有年仅八岁的幼子诸葛瞻。原载于国家人文历史微信公众号（ID：gjrwls），未经授权请勿转载。蜀汉建兴十二年 （即公元234年，魏青龙二年） ，五丈原的萧瑟寒风吹过大营，鞠躬尽瘁的诸葛丞相在秋风悲鸣中走完了传奇的一生。临终前，他最放不下两件事：一是未竟的北伐大业，二是年仅八岁的。这条来自国家人文历史。", "speech": "第 2 条，诸葛亮去世后，家族的后人都去哪了。临终前，他最放不下的除了北伐，还有年仅八岁的幼子诸葛瞻。原载于国家人文历史微信公众号（ID：gjrwls），未经授权请勿转载。蜀汉建兴十二年 （即公元234年，魏青龙二年） ，五丈原的萧瑟寒风吹过大营，鞠躬尽瘁的诸葛丞相在秋风悲鸣中走完了传奇的一生。临终前，他最放不下两件事：一是未竟的北伐大业，二是年仅八岁的。这条来自国家人文历史。", "chars": 190, "start": 45.07}, {"title": "难怪《尚公主》里的鱼公公这么嚣张，原来是鱼朝恩啊", "body": "原载于国家人文历史微信公众号（ID：gjrwls），未经授权请勿转载。新剧《尚公主》热播，不少观众被剧中鱼公公的嚣张惊到。这个角色原型正是中唐大名鼎鼎的鱼朝恩，历史上，他是敢在朝堂之上干预国事的宦官。那么，鱼朝恩凭什么敢这么嚣张呢？这背后不是他一个人的狂妄，而是安史之乱前后，唐朝一套权力结构悄悄变了。要探讨鱼。", "speech": "第 3 条，难怪《尚公主》里的鱼公公这么嚣张，原来是鱼朝恩啊。原载于国家人文历史微信公众号（ID：gjrwls），未经授权请勿转载。新剧《尚公主》热播，不少观众被剧中鱼公公的嚣张惊到。这个角色原型正是中唐大名鼎鼎的鱼朝恩，历史上，他是敢在朝堂之上干预国事的宦官。那么，鱼朝恩凭什么敢这么嚣张呢？这背后不是他一个人的狂妄，而是安史之乱前后，唐朝一套权力结构悄悄变了。要探讨鱼。", "chars": 187, "start": 86.33}, {"title": "古人下毒为什么都选酒，而不是茶", "body": "倒霉反派的三次失败，对应了毒药与茶,酒之间的“孽缘”。让我们来想象一个小故事：传说大宋年间，汴京城里有个杀手，诨号“三碗倒”，因为他入行以来接了三单生意，没有一单成功。第一次，他把砒霜掺进一壶龙井，结果目标人物是位茶道高手，一闻就皱眉：“这茶怎么一股铁锈味儿？”于是一整杯茶都喂了盆栽。第二次，他改用无色无味的。", "speech": "第 4 条，古人下毒为什么都选酒，而不是茶。倒霉反派的三次失败，对应了毒药与茶,酒之间的“孽缘”。让我们来想象一个小故事：传说大宋年间，汴京城里有个杀手，诨号“三碗倒”，因为他入行以来接了三单生意，没有一单成功。第一次，他把砒霜掺进一壶龙井，结果目标人物是位茶道高手，一闻就皱眉：“这茶怎么一股铁锈味儿？”于是一整杯茶都喂了盆栽。第二次，他改用无色无味的。", "chars": 178, "start": 126.58}, {"title": "为跨文明学术交流作出新的贡献", "body": "11月6日晚，中国古典文明研究院（以下简称“古典院”）2026年度年会暨考古成果发布仪式在希腊雅典举行。中国驻希腊大使馆、希腊文化部、美国、英国、德国等驻雅典古典院及相关学术机构的代表和专家学者齐聚一堂，共同回顾古典院成立两年来在文明交流、田野考古、学术研究和青年人才培养等方面取得的进展，探讨古典文明研究与跨。这条来自中国社会科学网·历史学。", "speech": "第 5 条，为跨文明学术交流作出新的贡献。11月6日晚，中国古典文明研究院（以下简称“古典院”）2026年度年会暨考古成果发布仪式在希腊雅典举行。中国驻希腊大使馆、希腊文化部、美国、英国、德国等驻雅典古典院及相关学术机构的代表和专家学者齐聚一堂，共同回顾古典院成立两年来在文明交流、田野考古、学术研究和青年人才培养等方面取得的进展，探讨古典文明研究与跨。这条来自中国社会科学网·历史学。", "chars": 193, "start": 163.32}, {"title": "大航海时代涌入明朝的巨额白银都去哪了", "body": "白银的故事之所以值得反复讲述，是因为它牵出的从来都是一个关于制度的故事。1571年，一艘西班牙大帆船从墨西哥阿卡普尔科港出发，载着来自波托西的白银横渡太平洋，驶向菲律宾马尼拉。在马尼拉，来自中国福建等地的商船早已等候多时，预备用丝绸、瓷器和棉布等商品换走一箱箱银锭。此后两百五十年间，这条航线将美洲白银持续运往。这条来自国家人文历史。", "speech": "第 6 条，大航海时代涌入明朝的巨额白银都去哪了。白银的故事之所以值得反复讲述，是因为它牵出的从来都是一个关于制度的故事。1571年，一艘西班牙大帆船从墨西哥阿卡普尔科港出发，载着来自波托西的白银横渡太平洋，驶向菲律宾马尼拉。在马尼拉，来自中国福建等地的商船早已等候多时，预备用丝绸、瓷器和棉布等商品换走一箱箱银锭。此后两百五十年间，这条航线将美洲白银持续运往。这条来自国家人文历史。", "chars": 192, "start": 204.89}, {"title": "古代皇帝每顿吃不完的饭菜后来都去哪了", "body": "这些食材做成菜肴摆上桌，少则几十道，多则上百道。原载于国家人文历史微信公众号（ID：gjrwls），未经授权请勿转载。在我国古代，皇帝的“御膳”究竟吃什么一直是个经久不息的话题。而自从清朝乾隆皇帝订立了宫廷膳食档案的规矩之后，我们终于对皇帝的每日饮食“份例”有了一定的了解：。盘肉二十二斤，汤肉五斤，猪油一斤。", "speech": "第 7 条，古代皇帝每顿吃不完的饭菜后来都去哪了。这些食材做成菜肴摆上桌，少则几十道，多则上百道。原载于国家人文历史微信公众号（ID：gjrwls），未经授权请勿转载。在我国古代，皇帝的“御膳”究竟吃什么一直是个经久不息的话题。而自从清朝乾隆皇帝订立了宫廷膳食档案的规矩之后，我们终于对皇帝的每日饮食“份例”有了一定的了解：。盘肉二十二斤，汤肉五斤，猪油一斤。", "chars": 180, "start": 246.41}, {"title": "走出“内亚”历史叙事误区", "body": "在欧亚大陆历史研究的学术图谱中，“内亚史观”带有严重的理论缺陷与价值偏差。它源于西方学界对欧亚大陆内陆区域历史的考察，本质上是西方中心主义史学框架的延伸与变种。部分学者片面放大“内亚”影响，为历史虚无主义提供可乘之机。新时代中国史研究须打破西方中心主义与狭隘区域视角的桎梏，构建立足中国历史实际、彰显中华民族多。这条来自中国社会科学网·历史学。", "speech": "第 8 条，走出“内亚”历史叙事误区。在欧亚大陆历史研究的学术图谱中，“内亚史观”带有严重的理论缺陷与价值偏差。它源于西方学界对欧亚大陆内陆区域历史的考察，本质上是西方中心主义史学框架的延伸与变种。部分学者片面放大“内亚”影响，为历史虚无主义提供可乘之机。新时代中国史研究须打破西方中心主义与狭隘区域视角的桎梏，构建立足中国历史实际、彰显中华民族多。这条来自中国社会科学网·历史学。", "chars": 191, "start": 283.92}, {"title": "水与沙的辩证法：千百年来的中国治河智慧", "body": "关禾 2026-10-30 来源：人民日报中央厨房-博古知今工作室。黄河入海处，水流舒展，泥沙渐次沉落。一粒泥沙的行程，可能关系着黄土高原的一场降雨，也贯通着中游水库的一次调度、下游河槽的一轮冲刷。亿万粒泥沙经年累月，足以抬高河床、改变河道，甚至在河口处塑造新的土地。水能挟沙入海，沙亦可淤河成灾，黄河水沙关系。这条来自国家人文历史。", "speech": "第 9 条，水与沙的辩证法：千百年来的中国治河智慧。关禾 2026-10-30 来源：人民日报中央厨房-博古知今工作室。黄河入海处，水流舒展，泥沙渐次沉落。一粒泥沙的行程，可能关系着黄土高原的一场降雨，也贯通着中游水库的一次调度、下游河槽的一轮冲刷。亿万粒泥沙经年累月，足以抬高河床、改变河道，甚至在河口处塑造新的土地。水能挟沙入海，沙亦可淤河成灾，黄河水沙关系。这条来自国家人文历史。", "chars": 193, "start": 324.29}, {"title": "秦始皇“奶奶”的陵墓被发现了？里面有什么", "body": "陕西咸阳原厚重的黄土之下，诸多秦国国君与他们的家人长眠于此。原载于国家人文历史微信公众号（ID：gjrwls），未经授权请勿转载。陕西咸阳的原野上坐落着一座座巍峨的封土，千百年风吹雨打，静静矗立。后世百姓望着这些土堆，凭着世代口耳相传，错把它们认作周文王、周武王的周王陵，也有不少被归为汉家古冢。这流传千年的误。", "speech": "第 10 条，秦始皇“奶奶”的陵墓被发现了？里面有什么。陕西咸阳原厚重的黄土之下，诸多秦国国君与他们的家人长眠于此。原载于国家人文历史微信公众号（ID：gjrwls），未经授权请勿转载。陕西咸阳的原野上坐落着一座座巍峨的封土，千百年风吹雨打，静静矗立。后世百姓望着这些土堆，凭着世代口耳相传，错把它们认作周文王、周武王的周王陵，也有不少被归为汉家古冢。这流传千年的误。", "chars": 184, "start": 365.95}, {"title": "华侨华人参与中国现代化建设的历史实践", "body": "1949年9月，中国人民政治协商会议第一届全体会议召开。华侨正式代表15人，包括陈嘉庚、司徒美堂等知名侨界人士与会，共商建国大计。近代以来，华侨通过兴学、兴办实业、资助革命和支援抗战，广泛参与中国的社会变革。此时，他们又以政治协商的方式参与新中国的创建。华侨华人在中国现代化进程中的作用，既体现为资金、知识和人。这条来自中国社会科学网·历史学。", "speech": "第 11 条，华侨华人参与中国现代化建设的历史实践。1949年9月，中国人民政治协商会议第一届全体会议召开。华侨正式代表15人，包括陈嘉庚、司徒美堂等知名侨界人士与会，共商建国大计。近代以来，华侨通过兴学、兴办实业、资助革命和支援抗战，广泛参与中国的社会变革。此时，他们又以政治协商的方式参与新中国的创建。华侨华人在中国现代化进程中的作用，既体现为资金、知识和人。这条来自中国社会科学网·历史学。", "chars": 198, "start": 405.58}, {"title": "长征文物，照见胜利之源", "body": "黄黎 2026-09-22 来源：《人民日报》（2026年09月19日 第08版）。陈毅《游击战争纪实》即《赣南游击词》20世纪60年代修改手稿。以上图片均为中国国家博物馆提供。中国国家博物馆的展柜中，几件革命文物静静陈列。90年前那场震撼世界的远征，硝烟早已散尽，而这几件烽火岁月留存下来的寻常旧物，从不同维。这条来自国家人文历史。", "speech": "第 12 条，长征文物，照见胜利之源。黄黎 2026-09-22 来源：《人民日报》（2026年09月19日 第08版）。陈毅《游击战争纪实》即《赣南游击词》20世纪60年代修改手稿。以上图片均为中国国家博物馆提供。中国国家博物馆的展柜中，几件革命文物静静陈列。90年前那场震撼世界的远征，硝烟早已散尽，而这几件烽火岁月留存下来的寻常旧物，从不同维。这条来自国家人文历史。", "chars": 186, "start": 450.1}], "seconds": 491.5, "rate": "+0%", "file": "https://cdn.jsdelivr.net/gh/liuyang987695908-spec/mingjian-audio@main/audio/2026-11-14/history.mp3?v=20261114080219", "backup": "audio/2026-11-14/history.mp3?v=20261114080219"}]};

  const row=document.createElement("div");row.className="row";
  row.innerHTML='<div class="name">'+s.emoji+" "+s.name
    +'<div class="meta" id="meta'+i+'">'+s.count+" 条 · 时长读取中</div></div><button>播放</button>";
  row.querySelector("button").onclick=()=>{play(i,false)};
  const det=document.createElement("details");
  det.innerHTML="<summary>本板块讲稿（"+s.count+" 条，可边听边看）</summary><div class='tr'>"
    +s.items.map((it,k)=>'<div class="ti" data-sec="'+i+'" data-i="'+k+'">'
      +'<div class="ts">'+fmt(it.start)+'</div><div class="tx"><b>'+it.title+'</b>'
      +(it.body?'<p>'+it.body+'</p>':'')+'</div></div>').join("")+"</div>";
  det.querySelectorAll(".ti").forEach(el=>{
    el.onclick=()=>{const sec=parseInt(el.dataset.sec),k=parseInt(el.dataset.i);
      const it=DATA.sections[sec].items[k];
      if(index!==sec||allMode){play(sec,false);}
      audio.currentTime=it.start;};
  });
  box.appendChild(row);box.appendChild(det);
  if(i<DATA.sections.length-1)box.style.borderBottom="1px solid var(--line)";
  list.appendChild(box);
});

function mark(i){document.querySelectorAll(".row").forEach((r,n)=>r.classList.toggle("on",n===i));}
function play(i,all){
  index=i;allMode=all;audio.src=DATA.sections[i].file;
  audio.dataset.backup=DATA.sections[i].backup||"";audio.dataset.trying=DATA.sections[i].file;
  const p=audio.play();
  if(p&&p.catch){p.catch(function(){document.getElementById("toggle").textContent="▶ 点此播放";});}
  mark(i);document.getElementById("nowTitle").textContent=DATA.sections[i].emoji+" "+DATA.sections[i].name;
  document.getElementById("mode").textContent=all?"全部连播":"单板块";
  document.getElementById("toggle").textContent="⏸";
}
audio.addEventListener("error",function(){
  const b=audio.dataset.backup;
  if(b&&audio.dataset.trying!==b){audio.dataset.trying=b;audio.src=b;audio.play().catch(function(){});}
});
function next(){if(index+1<DATA.sections.length){play(index+1,true)}else{allMode=false;document.getElementById("toggle").textContent="▶";}}
audio.addEventListener("ended",()=>{if(allMode)next();else document.getElementById("toggle").textContent="▶";});
let tick=0;
audio.addEventListener("timeupdate",()=>{
  document.getElementById("nowTime").textContent=fmt(audio.currentTime)+" / "+fmt(audio.duration);
  if(audio.duration)document.getElementById("seek").value=(audio.currentTime/audio.duration)*100;
  if(++tick%4===0){save();highlight();}
});
function highlight(){
  const sec=DATA.sections[index];if(!sec)return;
  let cur=-1;for(let k=0;k<sec.items.length;k++){if(audio.currentTime>=sec.items[k].start)cur=k;else break;}
  document.querySelectorAll(".ti.live").forEach(e=>e.classList.remove("live"));
  if(cur>=0){const el=document.querySelector('.ti[data-sec="'+index+'"][data-i="'+cur+'"]');
    if(el){el.classList.add("live");}}
}
audio.addEventListener("loadedmetadata",()=>{
  if(index>=0)document.getElementById("meta"+index).textContent=DATA.sections[index].count+" 条 · "+fmt(audio.duration);
});
audio.addEventListener("pause",save);
document.getElementById("playAll").onclick=()=>play(0,true);
document.getElementById("toggle").onclick=()=>{
  if(index<0){play(0,true);return}
  if(audio.paused){audio.play();document.getElementById("toggle").textContent="⏸"}
  else{audio.pause();document.getElementById("toggle").textContent="▶"}
};
document.getElementById("prev").onclick=()=>{if(index>0)play(index-1,allMode)};
document.getElementById("next").onclick=()=>{if(index+1<DATA.sections.length)play(index+1,allMode)};
document.getElementById("seek").oninput=e=>{if(audio.duration)audio.currentTime=audio.duration*e.target.value/100};
document.getElementById("resumeBtn").onclick=()=>{const s=saved();if(s){play(s.i,true);audio.currentTime=s.t||0;document.getElementById("resume").style.display="none";}};
document.getElementById("forgetBtn").onclick=()=>{localStorage.removeItem(KEY);document.getElementById("resume").style.display="none";play(0,true)};
(function(){const s=saved();if(s&&s.i<DATA.sections.length){
  document.getElementById("resumeText").innerHTML="上次听到 <b>"+DATA.sections[s.i].emoji+" "
    +DATA.sections[s.i].name+"</b> 的 "+fmt(s.t)+" 处";
  document.getElementById("resume").style.display="block";}})();
(function(){const h=(location.hash||"").replace("#","");if(!h)return;
  const i=DATA.sections.findIndex(s=>s.key===h);if(i>=0)play(i,false);})();
</script></body></html>
