海湿地（申报名称为“中国黄（渤）海候鸟栖息地（第一期）”）被列入世界自然遗产名录。）。真的想象不出。", "speech": "第 4 条，盐城黄海湿地——落潮留痕沙洲如画。在我国的黄海南部，有一片湿地——江苏盐城黄海湿地，目前不仅是世界上最大的海岸型湿地，也是世界上面积最大的辐射沙洲群。发布时间：2020年06月01日 文章出自：用户投稿 作者： 严正东。2019年7月5日，盐城黄海湿地（申报名称为“中国黄（渤）海候鸟栖息地（第一期）”）被列入世界自然遗产名录。）。真的想象不出。", "chars": 179, "start": 145.49}, {"title": "中国第一条民营铁路——个碧石铁路", "body": "发布时间：2020年01月06日 文章出自：用户投稿 作者： 赵艳青。她是全国轨距最窄的铁路；她是全国筑路时间最长的铁路；她是效益最显著的铁路；她是百年个碧石铁路！个碧石铁路是中国最早修筑的铁路之一，是中国唯一一条民营铁路，也是中国唯一一条轨距六十厘米的铁路。话说一九零三年，浪漫的法国人带着不浪漫的热兵器，气。", "speech": "第 5 条，中国第一条民营铁路——个碧石铁路。发布时间：2020年01月06日 文章出自：用户投稿 作者： 赵艳青。她是全国轨距最窄的铁路；她是全国筑路时间最长的铁路；她是效益最显著的铁路；她是百年个碧石铁路！个碧石铁路是中国最早修筑的铁路之一，是中国唯一一条民营铁路，也是中国唯一一条轨距六十厘米的铁路。话说一九零三年，浪漫的法国人带着不浪漫的热兵器，气。", "chars": 179, "start": 190.32}, {"title": "井盐与诺邓村", "body": "井盐，食盐的一种。诺邓村，又名诺邓井。井盐，从盐井汲取盐卤,设灶煎制而成。发布时间：2021年04月07日 文章出自：用户投稿 作者： 赵艳青。诺邓古村深藏于云南省大理州云龙县城北的大山中，是有着上千年厚重过往的白族村寨，村庄因盐业而生，因盐业而兴，长期煮盐贩盐，曾一度是滇西地区的经济重镇。西汉至南北朝时期。", "speech": "第 6 条，井盐与诺邓村。井盐，食盐的一种。诺邓村，又名诺邓井。井盐，从盐井汲取盐卤,设灶煎制而成。发布时间：2021年04月07日 文章出自：用户投稿 作者： 赵艳青。诺邓古村深藏于云南省大理州云龙县城北的大山中，是有着上千年厚重过往的白族村寨，村庄因盐业而生，因盐业而兴，长期煮盐贩盐，曾一度是滇西地区的经济重镇。西汉至南北朝时期。", "chars": 168, "start": 236.28}], "seconds": 285.2, "rate": "-19%", "file": "https://cdn.jsdelivr.net/gh/liuyang987695908-spec/mingjian-audio@main/audio/2026-11-25/geo.mp3?v=20261125133511", "backup": "audio/2026-11-25/geo.mp3?v=20261125133511"}, {"key": "history", "name": "历史", "emoji": "🏛️", "count": 11, "items": [{"title": "当人工智能成为历史研究的基础设施", "body": "2025年，中国计算机学会在北京举办了以“人文智能”为主题的学术研讨会，吸引了很多人文学者与会，其中不乏历史学者。会上有人文学者提到，能够使用人工智能将成为一名合格史学工作者的必备条件。会用人工智能是否存在定量的考核标准？在笔者看来，人工智能的有用性是由当前的信息差造成的。而人工智能成为历史研究的基础设施，人。这条来自中国社会科学网·历史学。", "speech": "第 1 条，当人工智能成为历史研究的基础设施。2025年，中国计算机学会在北京举办了以“人文智能”为主题的学术研讨会，吸引了很多人文学者与会，其中不乏历史学者。会上有人文学者提到，能够使用人工智能将成为一名合格史学工作者的必备条件。会用人工智能是否存在定量的考核标准？在笔者看来，人工智能的有用性是由当前的信息差造成的。而人工智能成为历史研究的基础设施，人。这条来自中国社会科学网·历史学。", "chars": 195, "start": 4.75}, {"title": "诸葛亮去世后，家族的后人都去哪了", "body": "临终前，他最放不下的除了北伐，还有年仅八岁的幼子诸葛瞻。原载于国家人文历史微信公众号（ID：gjrwls），未经授权请勿转载。蜀汉建兴十二年 （即公元234年，魏青龙二年） ，五丈原的萧瑟寒风吹过大营，鞠躬尽瘁的诸葛丞相在秋风悲鸣中走完了传奇的一生。临终前，他最放不下两件事：一是未竟的北伐大业，二是年仅八岁的。这条来自国家人文历史。", "speech": "第 2 条，诸葛亮去世后，家族的后人都去哪了。临终前，他最放不下的除了北伐，还有年仅八岁的幼子诸葛瞻。原载于国家人文历史微信公众号（ID：gjrwls），未经授权请勿转载。蜀汉建兴十二年 （即公元234年，魏青龙二年） ，五丈原的萧瑟寒风吹过大营，鞠躬尽瘁的诸葛丞相在秋风悲鸣中走完了传奇的一生。临终前，他最放不下两件事：一是未竟的北伐大业，二是年仅八岁的。这条来自国家人文历史。", "chars": 190, "start": 55.85}, {"title": "难怪《尚公主》里的鱼公公这么嚣张，原来是鱼朝恩啊", "body": "原载于国家人文历史微信公众号（ID：gjrwls），未经授权请勿转载。新剧《尚公主》热播，不少观众被剧中鱼公公的嚣张惊到。这个角色原型正是中唐大名鼎鼎的鱼朝恩，历史上，他是敢在朝堂之上干预国事的宦官。那么，鱼朝恩凭什么敢这么嚣张呢？这背后不是他一个人的狂妄，而是安史之乱前后，唐朝一套权力结构悄悄变了。要探讨鱼。", "speech": "第 3 条，难怪《尚公主》里的鱼公公这么嚣张，原来是鱼朝恩啊。原载于国家人文历史微信公众号（ID：gjrwls），未经授权请勿转载。新剧《尚公主》热播，不少观众被剧中鱼公公的嚣张惊到。这个角色原型正是中唐大名鼎鼎的鱼朝恩，历史上，他是敢在朝堂之上干预国事的宦官。那么，鱼朝恩凭什么敢这么嚣张呢？这背后不是他一个人的狂妄，而是安史之乱前后，唐朝一套权力结构悄悄变了。要探讨鱼。", "chars": 187, "start": 106.8}, {"title": "古人下毒为什么都选酒，而不是茶", "body": "倒霉反派的三次失败，对应了毒药与茶,酒之间的“孽缘”。让我们来想象一个小故事：传说大宋年间，汴京城里有个杀手，诨号“三碗倒”，因为他入行以来接了三单生意，没有一单成功。第一次，他把砒霜掺进一壶龙井，结果目标人物是位茶道高手，一闻就皱眉：“这茶怎么一股铁锈味儿？”于是一整杯茶都喂了盆栽。第二次，他改用无色无味的。", "speech": "第 4 条，古人下毒为什么都选酒，而不是茶。倒霉反派的三次失败，对应了毒药与茶,酒之间的“孽缘”。让我们来想象一个小故事：传说大宋年间，汴京城里有个杀手，诨号“三碗倒”，因为他入行以来接了三单生意，没有一单成功。第一次，他把砒霜掺进一壶龙井，结果目标人物是位茶道高手，一闻就皱眉：“这茶怎么一股铁锈味儿？”于是一整杯茶都喂了盆栽。第二次，他改用无色无味的。", "chars": 178, "start": 156.48}, {"title": "走近黄河下游最早的史前城址", "body": "王芬 2026-11-17 来源：《人民日报》（2026年11月14日 第08版）。焦家遗址位于山东省济南市章丘区，主体遗存属大汶口文化中晚期，距今约5200年至4400年，是黄河下游迄今发现年代最早的史前城址。作为与长江流域的“良渚古城”同时期的古城代表，“焦家古城”2024年被写入人教版全国统编七年级上册。", "speech": "第 5 条，走近黄河下游最早的史前城址。王芬 2026-11-17 来源：《人民日报》（2026年11月14日 第08版）。焦家遗址位于山东省济南市章丘区，主体遗存属大汶口文化中晚期，距今约5200年至4400年，是黄河下游迄今发现年代最早的史前城址。作为与长江流域的“良渚古城”同时期的古城代表，“焦家古城”2024年被写入人教版全国统编七年级上册。", "chars": 176, "start": 201.84}, {"title": "“兄台”的“台”，到底是什么台", "body": "那个曾经“来自星星”的“台”，如今落在人间，落入凡尘烟火气中。原载于国家人文历史微信公众号（ID：gjrwls），未经授权请勿转载。在古装剧或古典小说中，我们常常看到人物互称“兄台”。在古人的书信中，也常有“台鉴”“台驾”“台甫”等尊称。时至今日，“兄台”仍然是一个得体的、带一点书卷气的平辈敬称。可问题是，这。", "speech": "第 6 条，“兄台”的“台”，到底是什么台。那个曾经“来自星星”的“台”，如今落在人间，落入凡尘烟火气中。原载于国家人文历史微信公众号（ID：gjrwls），未经授权请勿转载。在古装剧或古典小说中，我们常常看到人物互称“兄台”。在古人的书信中，也常有“台鉴”“台驾”“台甫”等尊称。时至今日，“兄台”仍然是一个得体的、带一点书卷气的平辈敬称。可问题是，这。", "chars": 178, "start": 246.19}, {"title": "为跨文明学术交流作出新的贡献", "body": "11月6日晚，中国古典文明研究院（以下简称“古典院”）2026年度年会暨考古成果发布仪式在希腊雅典举行。中国驻希腊大使馆、希腊文化部、美国、英国、德国等驻雅典古典院及相关学术机构的代表和专家学者齐聚一堂，共同回顾古典院成立两年来在文明交流、田野考古、学术研究和青年人才培养等方面取得的进展，探讨古典文明研究与跨。这条来自中国社会科学网·历史学。", "speech": "第 7 条，为跨文明学术交流作出新的贡献。11月6日晚，中国古典文明研究院（以下简称“古典院”）2026年度年会暨考古成果发布仪式在希腊雅典举行。中国驻希腊大使馆、希腊文化部、美国、英国、德国等驻雅典古典院及相关学术机构的代表和专家学者齐聚一堂，共同回顾古典院成立两年来在文明交流、田野考古、学术研究和青年人才培养等方面取得的进展，探讨古典文明研究与跨。这条来自中国社会科学网·历史学。", "chars": 193, "start": 290.54}, {"title": "大航海时代涌入明朝的巨额白银都去哪了", "body": "白银的故事之所以值得反复讲述，是因为它牵出的从来都是一个关于制度的故事。原载于国家人文历史微信公众号（ID：gjrwls），未经授权请勿转载。1571年，一艘西班牙大帆船从墨西哥阿卡普尔科港出发，载着来自波托西的白银横渡太平洋，驶向菲律宾马尼拉。在马尼拉，来自中国福建等地的商船早已等候多时，预备用丝绸、瓷器和。这条来自国家人文历史。", "speech": "第 8 条，大航海时代涌入明朝的巨额白银都去哪了。白银的故事之所以值得反复讲述，是因为它牵出的从来都是一个关于制度的故事。原载于国家人文历史微信公众号（ID：gjrwls），未经授权请勿转载。1571年，一艘西班牙大帆船从墨西哥阿卡普尔科港出发，载着来自波托西的白银横渡太平洋，驶向菲律宾马尼拉。在马尼拉，来自中国福建等地的商船早已等候多时，预备用丝绸、瓷器和。这条来自国家人文历史。", "chars": 192, "start": 341.98}, {"title": "古代皇帝每顿吃不完的饭菜后来都去哪了", "body": "这些食材做成菜肴摆上桌，少则几十道，多则上百道。原载于国家人文历史微信公众号（ID：gjrwls），未经授权请勿转载。在我国古代，皇帝的“御膳”究竟吃什么一直是个经久不息的话题。而自从清朝乾隆皇帝订立了宫廷膳食档案的规矩之后，我们终于对皇帝的每日饮食“份例”有了一定的了解：。盘肉二十二斤，汤肉五斤，猪油一斤。", "speech": "第 9 条，古代皇帝每顿吃不完的饭菜后来都去哪了。这些食材做成菜肴摆上桌，少则几十道，多则上百道。原载于国家人文历史微信公众号（ID：gjrwls），未经授权请勿转载。在我国古代，皇帝的“御膳”究竟吃什么一直是个经久不息的话题。而自从清朝乾隆皇帝订立了宫廷膳食档案的规矩之后，我们终于对皇帝的每日饮食“份例”有了一定的了解：。盘肉二十二斤，汤肉五斤，猪油一斤。", "chars": 180, "start": 393.82}, {"title": "走出“内亚”历史叙事误区", "body": "在欧亚大陆历史研究的学术图谱中，“内亚史观”带有严重的理论缺陷与价值偏差。它源于西方学界对欧亚大陆内陆区域历史的考察，本质上是西方中心主义史学框架的延伸与变种。部分学者片面放大“内亚”影响，为历史虚无主义提供可乘之机。新时代中国史研究须打破西方中心主义与狭隘区域视角的桎梏，构建立足中国历史实际、彰显中华民族多。这条来自中国社会科学网·历史学。", "speech": "第 10 条，走出“内亚”历史叙事误区。在欧亚大陆历史研究的学术图谱中，“内亚史观”带有严重的理论缺陷与价值偏差。它源于西方学界对欧亚大陆内陆区域历史的考察，本质上是西方中心主义史学框架的延伸与变种。部分学者片面放大“内亚”影响，为历史虚无主义提供可乘之机。新时代中国史研究须打破西方中心主义与狭隘区域视角的桎梏，构建立足中国历史实际、彰显中华民族多。这条来自中国社会科学网·历史学。", "chars": 192, "start": 440.09}, {"title": "水与沙的辩证法：千百年来的中国治河智慧", "body": "关禾 2026-10-30 来源：人民日报中央厨房-博古知今工作室。黄河入海处，水流舒展，泥沙渐次沉落。一粒泥沙的行程，可能关系着黄土高原的一场降雨，也贯通着中游水库的一次调度、下游河槽的一轮冲刷。亿万粒泥沙经年累月，足以抬高河床、改变河道，甚至在河口处塑造新的土地。水能挟沙入海，沙亦可淤河成灾，黄河水沙关系。这条来自国家人文历史。", "speech": "第 11 条，水与沙的辩证法：千百年来的中国治河智慧。关禾 2026-10-30 来源：人民日报中央厨房-博古知今工作室。黄河入海处，水流舒展，泥沙渐次沉落。一粒泥沙的行程，可能关系着黄土高原的一场降雨，也贯通着中游水库的一次调度、下游河槽的一轮冲刷。亿万粒泥沙经年累月，足以抬高河床、改变河道，甚至在河口处塑造新的土地。水能挟沙入海，沙亦可淤河成灾，黄河水沙关系。这条来自国家人文历史。", "chars": 194, "start": 490.03}], "seconds": 544.4, "rate": "-19%", "file": "https://cdn.jsdelivr.net/gh/liuyang987695908-spec/mingjian-audio@main/audio/2026-11-25/history.mp3?v=20261125133511", "backup": "audio/2026-11-25/history.mp3?v=20261125133511"}]};
const KEY = "mingjian-" + DATA.date;
const audio = document.getElementById("audio");
let index = -1, allMode = false;

function fmt(s){s=Math.max(0,Math.floor(s||0));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function saved(){try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){return null}}
function save(){if(index<0)return;localStorage.setItem(KEY,JSON.stringify({i:index,t:audio.currentTime}));}

const list = document.getElementById("list");
DATA.sections.forEach((s,i)=>{
  const box=document.createElement("div");
  const row=document.createElement("div");row.className="row";

  row.querySelector("button").onclick=()=>{play(i,false)};
  const det=document.createElement("details");
  det.innerHTML="<summary>本板块讲稿（"+s.count+" 条，可边听边看）</summary><div class='tr'>"

      +'<div class="ts">'+fmt(it.start)+'</div><div class="tx"><b>'+it.title+'</b>'
      +(it.body?'<p>'+it.body+'</p>':'')+'</div></div>').join("")+"</div>";
  det.querySelectorAll(".ti").forEach(el=>{
    el.onclick=()=>{const sec=parseInt(el.dataset.sec),k=parseInt(el.dataset.i);
      const it=DATA.sections[sec].items[k];

  });

  if(i<DATA.sections.length-1)box.style.borderBottom="1px solid var(--line)";

function mark(i){document.querySelectorAll(".row").forEach((r,n)=>r.classList.toggle("on",n===i));}
function play(i,all){
  index=i;allMode=all;audio.src=DATA.sections[i].file;
  audio.dataset.backup=DATA.sections[i].backup||"";audio.dataset.trying=DATA.sections[i].file;
  const p=audio.play();
  if(p&&p.catch){p.catch(function(){document.getElementById("toggle").textContent="▶ 点此播放";});}
  mark(i);document.getElementById("nowTitle").textContent=DATA.sections[i].emoji+" "+DATA.sections[i].name;
  document.getElementById("mode").textContent=all?"全部连播":"单板块";
  document.getElementById("toggle").textContent="⏸";
}
audio.addEventListener("error",function(){
  const b=audio.dataset.backup;
  if(b&&audio.dataset.trying!==b){audio.dataset.trying=b;audio.src=b;audio.play().catch(function(){});}
});
function next(){if(index+1<DATA.sections.length){play(index+1,true)}else{allMode=false;document.getElementById("toggle").textContent="▶";}}
audio.addEventListener("ended",()=>{if(allMode)next();else document.getElementById("toggle").textContent="▶";});
let tick=0;
audio.addEventListener("timeupdate",()=>{
  document.getElementById("nowTime").textContent=fmt(audio.currentTime)+" / "+fmt(audio.duration);
  if(audio.duration)document.getElementById("seek").value=(audio.currentTime/audio.duration)*100;
  if(++tick%4===0){save();highlight();}
});
function highlight(){
  const sec=DATA.sections[index];if(!sec)return;
  let cur=-1;for(let k=0;k<sec.items.length;k++){if(audio.currentTime>=sec.items[k].start)cur=k;else break;}
  document.querySelectorAll(".ti.live").forEach(e=>e.classList.remove("live"));
  if(cur>=0){const el=document.querySelector('.ti[data-sec="'+index+'"][data-i="'+cur+'"]');
    if(el){el.classList.add("live");}}
}
audio.addEventListener("loadedmetadata",()=>{
  if(index>=0)document.getElementById("meta"+index).textContent=DATA.sections[index].count+" 条 · "+fmt(audio.duration);
});
audio.addEventListener("pause",save);
document.getElementById("playAll").onclick=()=>play(0,true);
document.getElementById("toggle").onclick=()=>{
  if(index<0){play(0,true);return}
  if(audio.paused){audio.play();document.getElementById("toggle").textContent="⏸"}
  else{audio.pause();document.getElementById("toggle").textContent="▶"}
};
document.getElementById("prev").onclick=()=>{if(index>0)play(index-1,allMode)};
document.getElementById("next").onclick=()=>{if(index+1<DATA.sections.length)play(index+1,allMode)};
document.getElementById("seek").oninput=e=>{if(audio.duration)audio.currentTime=audio.duration*e.target.value/100};
document.getElementById("resumeBtn").onclick=()=>{const s=saved();if(s){play(s.i,true);audio.currentTime=s.t||0;document.getElementById("resume").style.display="none";}};
document.getElementById("forgetBtn").onclick=()=>{localStorage.removeItem(KEY);document.getElementById("resume").style.display="none";play(0,true)};
(function(){const s=saved();if(s&&s.i<DATA.sections.length){
  document.getElementById("resumeText").innerHTML="上次听到 <b>"+DATA.sections[s.i].emoji+" "
    +DATA.sections[s.i].name+"</b> 的 "+fmt(s.t)+" 处";
  document.getElementById("resume").style.display="block";}})();
(function(){const h=(location.hash||"").replace("#","");if(!h)return;
  const i=DATA.sections.findIndex(s=>s.key===h);if(i>=0)play(i,false);})();
</script></body></html>
