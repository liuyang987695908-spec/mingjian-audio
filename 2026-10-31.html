自抖音热点。", "speech": "第 20 条，76人战胜尼克斯。这条来自抖音热点。", "chars": 25, "start": 205.39}, {"title": "长鑫科技前三季度净利润 1320 亿元，营收暴增 7 倍多，拟最高 20 亿元回购股份并注", "body": "这条来自知乎热榜。", "speech": "第 21 条，长鑫科技前三季度净利润 1320 亿元，营收暴增 7 倍多，拟最高 20 亿元回购股份并注。这条来自知乎热榜。", "chars": 62, "start": 212.4}, {"title": "姜乘澜回忆小时候的妈妈", "body": "这条来自抖音热点。", "speech": "第 22 条，姜乘澜回忆小时候的妈妈。这条来自抖音热点。", "chars": 28, "start": 228.14}], "seconds": 239.1, "rate": "-20%", "file": "https://cdn.jsdelivr.net/gh/liuyang987695908-spec/mingjian-audio@main/audio/2026-10-31/hot.mp3?v=20261031164528", "backup": "audio/2026-10-31/hot.mp3?v=20261031164528"}, {"key": "geo", "name": "地理", "emoji": "🗺️", "count": 10, "items": [{"title": "四川，到底有啥好的", "body": "提起四川，你会想到什么呢？是“实现熊猫自由”的天府之国，还是大街小巷的麻辣鲜香，峨眉山、九寨沟、黄龙、若尔盖、稻城亚丁、泸沽湖.....在舌尖和眼球的双重刺激下，不忘再补上一句：四川，真的很巴适！都说四川好，但是四川到底好在哪里呢？在中国地形三大阶梯中，四川恰好位于第一级—青藏高原和第三级—长江中下游平原的过。这条来自中国国家地理。", "speech": "第 1 条，四川，到底有啥好的。提起四川，你会想到什么呢？是“实现熊猫自由”的天府之国，还是大街小巷的麻辣鲜香，峨眉山、九寨沟、黄龙、若尔盖、稻城亚丁、泸沽湖.....在舌尖和眼球的双重刺激下，不忘再补上一句：四川，真的很巴适！都说四川好，但是四川到底好在哪里呢？在中国地形三大阶梯中，四川恰好位于第一级—青藏高原和第三级—长江中下游平原的过。这条来自中国国家地理。", "chars": 183, "start": 3.7}, {"title": "黄河不黄了？是真的", "body": "在人们的印象中，黄河一直以含沙量高著称。自高原山地飞驰而下，黄河裹挟大量泥沙，在入海口淤积造就了大片陆地。与此同时，黄河中游失去了大量的肥沃土地和水资源，下游及其相邻地区也频繁遭受洪水灾害。黄河水是“黄”还是“清”，从古至今一直备受关注。如今，黄河真的不黄了。根据《2021中国河流泥沙公报》显示，黄河流域代表。", "speech": "第 2 条，黄河不黄了？是真的。在人们的印象中，黄河一直以含沙量高著称。自高原山地飞驰而下，黄河裹挟大量泥沙，在入海口淤积造就了大片陆地。与此同时，黄河中游失去了大量的肥沃土地和水资源，下游及其相邻地区也频繁遭受洪水灾害。黄河水是“黄”还是“清”，从古至今一直备受关注。如今，黄河真的不黄了。根据《2021中国河流泥沙公报》显示，黄河流域代表。", "chars": 172, "start": 42.86}, {"title": "“三重”拉尼娜，这个冬天会是“冷冬”吗", "body": "不久前联合国世界气象组织（WMO）预计当前拉尼娜事件，将持续至2022年冬季，这将是21世纪首次出现的“三重”拉尼娜现象。 什么是拉尼娜？“三重”拉尼娜 将对我国今冬天气造成哪些影响？周兵： 首先拉尼娜是指赤道中、东太平洋海表温度异常，出现大范围偏冷、且强度和持续时间达到一定条件的冷水现象。它属于自然现象，理。", "speech": "第 3 条，“三重”拉尼娜，这个冬天会是“冷冬”吗。不久前联合国世界气象组织（WMO）预计当前拉尼娜事件，将持续至2022年冬季，这将是21世纪首次出现的“三重”拉尼娜现象。 什么是拉尼娜？“三重”拉尼娜 将对我国今冬天气造成哪些影响？周兵： 首先拉尼娜是指赤道中、东太平洋海表温度异常，出现大范围偏冷、且强度和持续时间达到一定条件的冷水现象。它属于自然现象，理。", "chars": 182, "start": 81.41}, {"title": "盐城黄海湿地——落潮留痕沙洲如画", "body": "在我国的黄海南部，有一片湿地——江苏盐城黄海湿地，目前不仅是世界上最大的海岸型湿地，也是世界上面积最大的辐射沙洲群。发布时间：2020年06月01日 文章出自：用户投稿 作者： 严正东。2019年7月5日，盐城黄海湿地（申报名称为“中国黄（渤）海候鸟栖息地（第一期）”）被列入世界自然遗产名录。）。真的想象不出。", "speech": "第 4 条，盐城黄海湿地——落潮留痕沙洲如画。在我国的黄海南部，有一片湿地——江苏盐城黄海湿地，目前不仅是世界上最大的海岸型湿地，也是世界上面积最大的辐射沙洲群。发布时间：2020年06月01日 文章出自：用户投稿 作者： 严正东。2019年7月5日，盐城黄海湿地（申报名称为“中国黄（渤）海候鸟栖息地（第一期）”）被列入世界自然遗产名录。）。真的想象不出。", "chars": 179, "start": 120.29}, {"title": "中国第一条民营铁路——个碧石铁路", "body": "发布时间：2020年01月06日 文章出自：用户投稿 作者： 赵艳青。她是全国轨距最窄的铁路；她是全国筑路时间最长的铁路；她是效益最显著的铁路；她是百年个碧石铁路！个碧石铁路是中国最早修筑的铁路之一，是中国唯一一条民营铁路，也是中国唯一一条轨距六十厘米的铁路。话说一九零三年，浪漫的法国人带着不浪漫的热兵器，气。", "speech": "第 5 条，中国第一条民营铁路——个碧石铁路。发布时间：2020年01月06日 文章出自：用户投稿 作者： 赵艳青。她是全国轨距最窄的铁路；她是全国筑路时间最长的铁路；她是效益最显著的铁路；她是百年个碧石铁路！个碧石铁路是中国最早修筑的铁路之一，是中国唯一一条民营铁路，也是中国唯一一条轨距六十厘米的铁路。话说一九零三年，浪漫的法国人带着不浪漫的热兵器，气。", "chars": 179, "start": 157.37}, {"title": "行走在邓家围屋，静听岁月的轻语", "body": "关于围屋，有讲不完的故事，写不完的诗。围屋，就像一个散落的城堡，在乡村，静静地矗立，默默地遥望。随着经济社会的快速发展，城镇化愈演愈烈，新宅在建，围屋在守望。发布时间：2019年05月13日 文章出自：用户投稿 作者： 杜建群。初夏的的午后，我寻寻觅觅，遇见了你清晰的纹路。你无声又无言，却告诉我那曾经的过往。", "speech": "第 6 条，行走在邓家围屋，静听岁月的轻语。关于围屋，有讲不完的故事，写不完的诗。围屋，就像一个散落的城堡，在乡村，静静地矗立，默默地遥望。随着经济社会的快速发展，城镇化愈演愈烈，新宅在建，围屋在守望。发布时间：2019年05月13日 文章出自：用户投稿 作者： 杜建群。初夏的的午后，我寻寻觅觅，遇见了你清晰的纹路。你无声又无言，却告诉我那曾经的过往。", "chars": 177, "start": 195.36}, {"title": "重庆：世界上唯一建在平行岭谷的大城市", "body": "重庆人向外地人介绍重庆时，常会略带几分自豪地用方言说“我们这里是山城”，而且还要将“山”字狠狠地拖出一个尾音来才过瘾。对于重庆人来说，爬坡上坎是再寻常不过的事情。在这里坐轻轨有着过山车一般的体验，这里的九楼换个面就是一楼……发布时间：2018年08月29日 文章出自：用户投稿 作者： 彭怀月。中国这么大，有山。", "speech": "第 7 条，重庆：世界上唯一建在平行岭谷的大城市。重庆人向外地人介绍重庆时，常会略带几分自豪地用方言说“我们这里是山城”，而且还要将“山”字狠狠地拖出一个尾音来才过瘾。对于重庆人来说，爬坡上坎是再寻常不过的事情。在这里坐轻轨有着过山车一般的体验，这里的九楼换个面就是一楼……发布时间：2018年08月29日 文章出自：用户投稿 作者： 彭怀月。中国这么大，有山。", "chars": 181, "start": 234.19}, {"title": "琥珀，带你穿越至远古的宝石", "body": "琥珀，也称虎魄，在传说中是一种由老虎魂魄结晶而成的宝石。数千万年的时光冲刷洗礼，让它绽放出神秘而温润的光芒。它的神秘与美丽，让世人赋予了许多传奇色彩，甚至于有一种颜色，是直接以琥珀命名的。发布时间：2019年11月05日 文章出自：用户投稿 作者： 田庄。从东半球的中国辽宁，到西半球的美国新泽西，从冰天雪地的。", "speech": "第 8 条，琥珀，带你穿越至远古的宝石。琥珀，也称虎魄，在传说中是一种由老虎魂魄结晶而成的宝石。数千万年的时光冲刷洗礼，让它绽放出神秘而温润的光芒。它的神秘与美丽，让世人赋予了许多传奇色彩，甚至于有一种颜色，是直接以琥珀命名的。发布时间：2019年11月05日 文章出自：用户投稿 作者： 田庄。从东半球的中国辽宁，到西半球的美国新泽西，从冰天雪地的。", "chars": 176, "start": 271.97}, {"title": "山南秘境勒布沟", "body": "如今去西藏已经不是难事儿，走过川藏线，赏过林芝桃花，朝圣过阿里神山，墙裂推荐大家去看看被遗忘的山南秘境这座藏源之地，有着国境线的喜马拉雅之南，竟然深藏着壮美的雪山，高山瀑布、鲜花满山的绝美风光。发布时间：2019年07月17日 文章出自：用户投稿 作者： 胡澍。当然除了秘境之外也有必备的打卡之地藏王第一宫雍布。", "speech": "第 9 条，山南秘境勒布沟。如今去西藏已经不是难事儿，走过川藏线，赏过林芝桃花，朝圣过阿里神山，墙裂推荐大家去看看被遗忘的山南秘境这座藏源之地，有着国境线的喜马拉雅之南，竟然深藏着壮美的雪山，高山瀑布、鲜花满山的绝美风光。发布时间：2019年07月17日 文章出自：用户投稿 作者： 胡澍。当然除了秘境之外也有必备的打卡之地藏王第一宫雍布。", "chars": 170, "start": 310.44}, {"title": "井盐与诺邓村", "body": "井盐，食盐的一种。诺邓村，又名诺邓井。井盐，从盐井汲取盐卤,设灶煎制而成。发布时间：2021年04月07日 文章出自：用户投稿 作者： 赵艳青。诺邓古村深藏于云南省大理州云龙县城北的大山中，是有着上千年厚重过往的白族村寨，村庄因盐业而生，因盐业而兴，长期煮盐贩盐，曾一度是滇西地区的经济重镇。西汉至南北朝时期。", "speech": "第 10 条，井盐与诺邓村。井盐，食盐的一种。诺邓村，又名诺邓井。井盐，从盐井汲取盐卤,设灶煎制而成。发布时间：2021年04月07日 文章出自：用户投稿 作者： 赵艳青。诺邓古村深藏于云南省大理州云龙县城北的大山中，是有着上千年厚重过往的白族村寨，村庄因盐业而生，因盐业而兴，长期煮盐贩盐，曾一度是滇西地区的经济重镇。西汉至南北朝时期。", "chars": 169, "start": 346.9}], "seconds": 387.5, "rate": "-2%", "file": "https://cdn.jsdelivr.net/gh/liuyang987695908-spec/mingjian-audio@main/audio/2026-10-31/geo.mp3?v=20261031164528", "backup": "audio/2026-10-31/geo.mp3?v=20261031164528"}, {"key": "history", "name": "历史", "emoji": "🏛️", "count": 12, "items": [{"title": "仰望星空：中国古代天文里的智慧与精神", "body": "北京建国门的车水马龙旁，藏着一座与周遭喧嚣格格不入的神秘古建筑。它已仰望天空近六百年，是世界上现存最古老且连续观测时间最长的古观象台之一。登上高台，八件青铜天文仪器仍把复杂的圆环伸向天空，继续守护着日月星辰，在人们目所不及的地方，延续着一项沉默、古老的使命。近日，《国家人文历史》采访了北京天文馆副馆长、北京古。这条来自国家人文历史。", "speech": "第 1 条，仰望星空：中国古代天文里的智慧与精神。北京建国门的车水马龙旁，藏着一座与周遭喧嚣格格不入的神秘古建筑。它已仰望天空近六百年，是世界上现存最古老且连续观测时间最长的古观象台之一。登上高台，八件青铜天文仪器仍把复杂的圆环伸向天空，继续守护着日月星辰，在人们目所不及的地方，延续着一项沉默、古老的使命。近日，《国家人文历史》采访了北京天文馆副馆长、北京古。这条来自国家人文历史。", "chars": 192, "start": 3.02}, {"title": "诸葛亮去世后，家族的后人都去哪了", "body": "临终前，他最放不下的除了北伐，还有年仅八岁的幼子诸葛瞻。原载于国家人文历史微信公众号（ID：gjrwls），未经授权请勿转载。蜀汉建兴十二年 （即公元234年，魏青龙二年） ，五丈原的萧瑟寒风吹过大营，鞠躬尽瘁的诸葛丞相在秋风悲鸣中走完了传奇的一生。临终前，他最放不下两件事：一是未竟的北伐大业，二是年仅八岁的。", "speech": "第 2 条，诸葛亮去世后，家族的后人都去哪了。临终前，他最放不下的除了北伐，还有年仅八岁的幼子诸葛瞻。原载于国家人文历史微信公众号（ID：gjrwls），未经授权请勿转载。蜀汉建兴十二年 （即公元234年，魏青龙二年） ，五丈原的萧瑟寒风吹过大营，鞠躬尽瘁的诸葛丞相在秋风悲鸣中走完了传奇的一生。临终前，他最放不下两件事：一是未竟的北伐大业，二是年仅八岁的。", "chars": 179, "start": 35.09}, {"title": "人工智能时代，历史学如何认识自身", "body": "当下，历史学正在经历第四次重大革命——书写者革命，即AI与人类共同成为历史学的书写者，史学研究者的存在合理性首次受到严重质疑，历史学的本质、边界与价值随之迎来新一轮审视。回顾历史学的发展历程，第一次重大革命可称作书写革命，是指历史从口传、记忆转变为文字、文本的过程，解决了历史如何被记录、早期历史学何以诞生的问。这条来自中国社会科学网·历史学。", "speech": "第 3 条，人工智能时代，历史学如何认识自身。当下，历史学正在经历第四次重大革命——书写者革命，即AI与人类共同成为历史学的书写者，史学研究者的存在合理性首次受到严重质疑，历史学的本质、边界与价值随之迎来新一轮审视。回顾历史学的发展历程，第一次重大革命可称作书写革命，是指历史从口传、记忆转变为文字、文本的过程，解决了历史如何被记录、早期历史学何以诞生的问。这条来自中国社会科学网·历史学。", "chars": 195, "start": 65.26}, {"title": "明朝灭亡后，最后一任锦衣卫指挥使结局如何", "body": "马吉翔的手段不止于阿谀奉承还体现在毒辣的政治眼光上。原载于国家人文历史微信公众号(ID:gjrwls)，未经授权请勿转载。锦衣卫，这个在明朝让百官闻风丧胆的特务机构，从朱元璋设立的那天起便如影随形地陪了明朝近三百年。当崇祯皇帝在煤山自缢，大明王朝轰然倒塌后，锦衣卫的故事并未就此终结。在南明流亡朝廷的废墟上，最。这条来自国家人文历史。", "speech": "第 4 条，明朝灭亡后，最后一任锦衣卫指挥使结局如何。马吉翔的手段不止于阿谀奉承还体现在毒辣的政治眼光上。原载于国家人文历史微信公众号(ID:gjrwls)，未经授权请勿转载。锦衣卫，这个在明朝让百官闻风丧胆的特务机构，从朱元璋设立的那天起便如影随形地陪了明朝近三百年。当崇祯皇帝在煤山自缢，大明王朝轰然倒塌后，锦衣卫的故事并未就此终结。在南明流亡朝廷的废墟上，最。这条来自国家人文历史。", "chars": 194, "start": 98.5}, {"title": "人工智能赋能史学研究的两条路径", "body": "近年来，人工智能与历史学的关系日益受到学术界关注，围绕大语言模型的讨论尤为集中。人工智能在史学应用中存在生成错误知识、削弱学者主体性、模糊原创边界等问题，应受到重视。但如果讨论长期停留在人工智能“会不会替代”等层面，则易将人工智能视为史学研究的外部威胁，忽视其已经引发及可能进一步带来的变化。人工智能未必改变历。这条来自中国社会科学网·历史学。", "speech": "第 5 条，人工智能赋能史学研究的两条路径。近年来，人工智能与历史学的关系日益受到学术界关注，围绕大语言模型的讨论尤为集中。人工智能在史学应用中存在生成错误知识、削弱学者主体性、模糊原创边界等问题，应受到重视。但如果讨论长期停留在人工智能“会不会替代”等层面，则易将人工智能视为史学研究的外部威胁，忽视其已经引发及可能进一步带来的变化。人工智能未必改变历。这条来自中国社会科学网·历史学。", "chars": 194, "start": 131.81}, {"title": "刘邦能力那么强，为什么之前一直一事无成", "body": "这十几年的经历看似空空荡荡，实则为刘邦的未来之路筑牢了认知根基。原载于国家人文历史微信公众号（ID：gjrwls），未经授权请勿转载。纵观中国古代历史，汉高祖刘邦的人生轨迹恐怕最具反差，也最易被世俗误读。秦始皇凭六世基业横扫八方，项羽以绝代天赋少年封神，二者的成功皆有迹可循、顺理成章。唯独刘邦，青年时“不事生。这条来自国家人文历史。", "speech": "第 6 条，刘邦能力那么强，为什么之前一直一事无成。这十几年的经历看似空空荡荡，实则为刘邦的未来之路筑牢了认知根基。原载于国家人文历史微信公众号（ID：gjrwls），未经授权请勿转载。纵观中国古代历史，汉高祖刘邦的人生轨迹恐怕最具反差，也最易被世俗误读。秦始皇凭六世基业横扫八方，项羽以绝代天赋少年封神，二者的成功皆有迹可循、顺理成章。唯独刘邦，青年时“不事生。这条来自国家人文历史。", "chars": 193, "start": 164.28}, {"title": "史学理论研究要面向“四个之问", "body": "习近平总书记在哲学社会科学工作座谈会上指出，“一切有理想、有抱负的哲学社会科学工作者都应该立时代之潮头、通古今之变化、发思想之先声，积极为党和人民述学立论、建言献策，担负起历史赋予的光荣使命”。史学理论研究肩负着认识历史、把握现实、引领未来的重要使命。坚持问题导向，是推动史学理论创新发展的现实动力，也是科学回。这条来自中国社会科学网·历史学。", "speech": "第 7 条，史学理论研究要面向“四个之问。习近平总书记在哲学社会科学工作座谈会上指出，“一切有理想、有抱负的哲学社会科学工作者都应该立时代之潮头、通古今之变化、发思想之先声，积极为党和人民述学立论、建言献策，担负起历史赋予的光荣使命”。史学理论研究肩负着认识历史、把握现实、引领未来的重要使命。坚持问题导向，是推动史学理论创新发展的现实动力，也是科学回。这条来自中国社会科学网·历史学。", "chars": 193, "start": 197.9}, {"title": "水与沙的辩证法：千百年来的中国治河智慧", "body": "关禾 2026-10-30 来源：人民日报中央厨房-博古知今工作室。黄河入海处，水流舒展，泥沙渐次沉落。一粒泥沙的行程，可能关系着黄土高原的一场降雨，也贯通着中游水库的一次调度、下游河槽的一轮冲刷。亿万粒泥沙经年累月，足以抬高河床、改变河道，甚至在河口处塑造新的土地。水能挟沙入海，沙亦可淤河成灾，黄河水沙关系。这条来自国家人文历史。", "speech": "第 8 条，水与沙的辩证法：千百年来的中国治河智慧。关禾 2026-10-30 来源：人民日报中央厨房-博古知今工作室。黄河入海处，水流舒展，泥沙渐次沉落。一粒泥沙的行程，可能关系着黄土高原的一场降雨，也贯通着中游水库的一次调度、下游河槽的一轮冲刷。亿万粒泥沙经年累月，足以抬高河床、改变河道，甚至在河口处塑造新的土地。水能挟沙入海，沙亦可淤河成灾，黄河水沙关系。这条来自国家人文历史。", "chars": 193, "start": 230.18}, {"title": "在农耕图像里的文明追寻", "body": "一幅幅镌刻着重农文脉的古代耕织图，成为山东大学教授王加华步入中华农耕文明研究的导引。这位历史学出身的青年学者，二十余载治学之路，几经辗转，在民族史、农业史、戏剧研究与民俗调查的探索中不断校准方向，最终锚定“农耕传统与中华文明”的核心议题。2000年，王加华成为复旦大学历史地理研究所的硕士研究生。受导师王建革教。这条来自中国社会科学网·历史学。", "speech": "第 9 条，在农耕图像里的文明追寻。一幅幅镌刻着重农文脉的古代耕织图，成为山东大学教授王加华步入中华农耕文明研究的导引。这位历史学出身的青年学者，二十余载治学之路，几经辗转，在民族史、农业史、戏剧研究与民俗调查的探索中不断校准方向，最终锚定“农耕传统与中华文明”的核心议题。2000年，王加华成为复旦大学历史地理研究所的硕士研究生。受导师王建革教。这条来自中国社会科学网·历史学。", "chars": 190, "start": 262.78}, {"title": "秦始皇“奶奶”的陵墓被发现了？里面有什么", "body": "陕西咸阳原厚重的黄土之下，诸多秦国国君与他们的家人长眠于此。原载于国家人文历史微信公众号（ID：gjrwls），未经授权请勿转载。陕西咸阳的原野上坐落着一座座巍峨的封土，千百年风吹雨打，静静矗立。后世百姓望着这些土堆，凭着世代口耳相传，错把它们认作周文王、周武王的周王陵，也有不少被归为汉家古冢。这流传千年的误。这条来自国家人文历史。", "speech": "第 10 条，秦始皇“奶奶”的陵墓被发现了？里面有什么。陕西咸阳原厚重的黄土之下，诸多秦国国君与他们的家人长眠于此。原载于国家人文历史微信公众号（ID：gjrwls），未经授权请勿转载。陕西咸阳的原野上坐落着一座座巍峨的封土，千百年风吹雨打，静静矗立。后世百姓望着这些土堆，凭着世代口耳相传，错把它们认作周文王、周武王的周王陵，也有不少被归为汉家古冢。这流传千年的误。这条来自国家人文历史。", "chars": 195, "start": 295.06}, {"title": "长征文物，照见胜利之源", "body": "黄黎 2026-09-22 来源：《人民日报》（2026年09月19日 第08版）。陈毅《游击战争纪实》即《赣南游击词》20世纪60年代修改手稿。以上图片均为中国国家博物馆提供。中国国家博物馆的展柜中，几件革命文物静静陈列。90年前那场震撼世界的远征，硝烟早已散尽，而这几件烽火岁月留存下来的寻常旧物，从不同维。", "speech": "第 11 条，长征文物，照见胜利之源。黄黎 2026-09-22 来源：《人民日报》（2026年09月19日 第08版）。陈毅《游击战争纪实》即《赣南游击词》20世纪60年代修改手稿。以上图片均为中国国家博物馆提供。中国国家博物馆的展柜中，几件革命文物静静陈列。90年前那场震撼世界的远征，硝烟早已散尽，而这几件烽火岁月留存下来的寻常旧物，从不同维。", "chars": 175   det.innerHTML="<summary>本板块讲稿（"+s.count+" 条，可边听边看）</summary><div class='tr'>"
    +s.items.map((it,k)=>'<div class="ti" data-sec="'+i+'" data-i="'+k+'">'
      +'<div class="ts">'+fmt(it.start)+'</div><div class="tx"><b>'+it.title+'</b>'
      +(it.body?'<p>'+it.body+'</p>':'')+'</div></div>').join("")+"</div>";
  det.querySelectorAll(".ti").forEach(el=>{
    el.onclick=()=>{const sec=parseInt(el.dataset.sec),k=parseInt(el.dataset.i);
      const it=DATA.sections[sec].items[k];
      if(index!==sec||allMode){play(sec,false);}
      audio.currentTime=it.start;};
  });
  box.appendChild(row);box.appendChild(det);
  if(i<DATA.sections.length-1)box.style.borderBottom="1px solid var(--line)";
  list.appendChild(box);
});

function mark(i){document.querySelectorAll(".row").forEach((r,n)=>r.classList.toggle("on",n===i));}
function play(i,all){
  index=i;allMode=all;audio.src=DATA.sections[i].file;
  audio.dataset.backup=DATA.sections[i].backup||"";audio.dataset.trying=DATA.sections[i].file;
  const p=audio.play();
  if(p&&p.catch){p.catch(function(){document.getElementById("toggle").textContent="▶ 点此播放";});}
  mark(i);document.getElementById("nowTitle").textContent=DATA.sections[i].emoji+" "+DATA.sections[i].name;
  document.getElementById("mode").textContent=all?"全部连播":"单板块";
  document.getElementById("toggle").textContent="⏸";
}
audio.addEventListener("error",function(){
  const b=audio.dataset.backup;
  if(b&&audio.dataset.trying!==b){audio.dataset.trying=b;audio.src=b;audio.play().catch(function(){});}
});
function next(){if(index+1<DATA.sections.length){play(index+1,true)}else{allMode=false;document.getElementById("toggle").textContent="▶";}}
audio.addEventListener("ended",()=>{if(allMode)next();else document.getElementById("toggle").textContent="▶";});
let tick=0;
audio.addEventListener("timeupdate",()=>{
  document.getElementById("nowTime").textContent=fmt(audio.currentTime)+" / "+fmt(audio.duration);
  if(audio.duration)document.getElementById("seek").value=(audio.currentTime/audio.duration)*100;
  if(++tick%4===0){save();highlight();}
});
function highlight(){
  const sec=DATA.sections[index];if(!sec)return;
  let cur=-1;for(let k=0;k<sec.items.length;k++){if(audio.currentTime>=sec.items[k].start)cur=k;else break;}
  document.querySelectorAll(".ti.live").forEach(e=>e.classList.remove("live"));
  if(cur>=0){const el=document.querySelector('.ti[data-sec="'+index+'"][data-i="'+cur+'"]');
    if(el){el.classList.add("live");}}
}
audio.addEventListener("loadedmetadata",()=>{
  if(index>=0)document.getElementById("meta"+index).textContent=DATA.sections[index].count+" 条 · "+fmt(audio.duration);
});
audio.addEventListener("pause",save);
document.getElementById("playAll").onclick=()=>play(0,true);
document.getElementById("toggle").onclick=()=>{
  if(index<0){play(0,true);return}
  if(audio.paused){audio.play();document.getElementById("toggle").textContent="⏸"}
  else{audio.pause();document.getElementById("toggle").textContent="▶"}
};
document.getElementById("prev").onclick=()=>{if(index>0)play(index-1,allMode)};
document.getElementById("next").onclick=()=>{if(index+1<DATA.sections.length)play(index+1,allMode)};
document.getElementById("seek").oninput=e=>{if(audio.duration)audio.currentTime=audio.duration*e.target.value/100};
document.getElementById("resumeBtn").onclick=()=>{const s=saved();if(s){play(s.i,true);audio.currentTime=s.t||0;document.getElementById("resume").style.display="none";}};
document.getElementById("forgetBtn").onclick=()=>{localStorage.removeItem(KEY);document.getElementById("resume").style.display="none";play(0,true)};
(function(){const s=saved();if(s&&s.i<DATA.sections.length){
  document.getElementById("resumeText").innerHTML="上次听到 <b>"+DATA.sections[s.i].emoji+" "
    +DATA.sections[s.i].name+"</b> 的 "+fmt(s.t)+" 处";
  document.getElementById("resume").style.display="block";}})();
(function(){const h=(location.hash||"").replace("#","");if(!h)return;
  const i=DATA.sections.findIndex(s=>s.key===h);if(i>=0)play(i,false);})();
</script></body></html>
