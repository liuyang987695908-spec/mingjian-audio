start": 149.38}, {"title": "离岸信托个税申报累计超 1600 亿元，10 月入库超 1200 亿，带动当月全国个税收入", "body": "这条来自知乎热榜。", "speech": "第 17 条，离岸信托个税申报累计超 1600 亿元，10 月入库超 1200 亿，带动当月全国个税收入。这条来自知乎热榜。", "chars": 62, "start": 155.76}, {"title": "胡塞武装发射导弹袭击沙特", "body": "这条来自抖音热点。", "speech": "第 18 条，胡塞武装发射导弹袭击沙特。这条来自抖音热点。", "chars": 29, "start": 168.41}, {"title": "如果刚在图书馆一个空位子上坐下，有人过来说这是对方的位子，只是有事离开，要不要把位子还回去", "body": "这条来自知乎热榜。", "speech": "第 19 条，如果刚在图书馆一个空位子上坐下，有人过来说这是对方的位子，只是有事离开，要不要把位子还回去。这条来自知乎热榜。", "chars": 62, "start": 175.32}, {"title": "秋日实况加了什么好有氛围感", "body": "这条来自抖音热点。", "speech": "第 20 条，秋日实况加了什么好有氛围感。这条来自抖音热点。", "chars": 30, "start": 188.33}, {"title": "沙僧在《西游记》中，除了挑担子外，出场的时候很少，为什么吴承恩在写《西游记》时不把他删掉", "body": "这条来自知乎热榜。", "speech": "第 21 条，沙僧在《西游记》中，除了挑担子外，出场的时候很少，为什么吴承恩在写《西游记》时不把他删掉。这条来自知乎热榜。", "chars": 61, "start": 195.0}, {"title": "长虹电器原董事长倪润峰去世", "body": "这条来自抖音热点。", "speech": "第 22 条，长虹电器原董事长倪润峰去世。这条来自抖音热点。", "chars": 30, "start": 207.53}], "seconds": 217.2, "rate": "-3%", "file": "https://cdn.jsdelivr.net/gh/liuyang987695908-spec/mingjian-audio@main/audio/2026-11-12/hot.mp3?v=20261112081402", "backup": "audio/2026-11-12/hot.mp3?v=20261112081402"}, {"key": "geo", "name": "地理", "emoji": "🗺️", "count": 10, "items": [{"title": "四川，到底有啥好的", "body": "提起四川，你会想到什么呢？是“实现熊猫自由”的天府之国，还是大街小巷的麻辣鲜香，峨眉山、九寨沟、黄龙、若尔盖、稻城亚丁、泸沽湖.....在舌尖和眼球的双重刺激下，不忘再补上一句：四川，真的很巴适！都说四川好，但是四川到底好在哪里呢？在中国地形三大阶梯中，四川恰好位于第一级—青藏高原和第三级—长江中下游平原的过。这条来自中国国家地理。", "speech": "第 1 条，四川，到底有啥好的。提起四川，你会想到什么呢？是“实现熊猫自由”的天府之国，还是大街小巷的麻辣鲜香，峨眉山、九寨沟、黄龙、若尔盖、稻城亚丁、泸沽湖.....在舌尖和眼球的双重刺激下，不忘再补上一句：四川，真的很巴适！都说四川好，但是四川到底好在哪里呢？在中国地形三大阶梯中，四川恰好位于第一级—青藏高原和第三级—长江中下游平原的过。这条来自中国国家地理。", "chars": 183, "start": 3.74}, {"title": "黄河不黄了？是真的", "body": "在人们的印象中，黄河一直以含沙量高著称。自高原山地飞驰而下，黄河裹挟大量泥沙，在入海口淤积造就了大片陆地。与此同时，黄河中游失去了大量的肥沃土地和水资源，下游及其相邻地区也频繁遭受洪水灾害。黄河水是“黄”还是“清”，从古至今一直备受关注。如今，黄河真的不黄了。根据《2021中国河流泥沙公报》显示，黄河流域代表。", "speech": "第 2 条，黄河不黄了？是真的。在人们的印象中，黄河一直以含沙量高著称。自高原山地飞驰而下，黄河裹挟大量泥沙，在入海口淤积造就了大片陆地。与此同时，黄河中游失去了大量的肥沃土地和水资源，下游及其相邻地区也频繁遭受洪水灾害。黄河水是“黄”还是“清”，从古至今一直备受关注。如今，黄河真的不黄了。根据《2021中国河流泥沙公报》显示，黄河流域代表。", "chars": 172, "start": 43.32}, {"title": "“三重”拉尼娜，这个冬天会是“冷冬”吗", "body": "不久前联合国世界气象组织（WMO）预计当前拉尼娜事件，将持续至2022年冬季，这将是21世纪首次出现的“三重”拉尼娜现象。 什么是拉尼娜？“三重”拉尼娜 将对我国今冬天气造成哪些影响？周兵： 首先拉尼娜是指赤道中、东太平洋海表温度异常，出现大范围偏冷、且强度和持续时间达到一定条件的冷水现象。它属于自然现象，理。", "speech": "第 3 条，“三重”拉尼娜，这个冬天会是“冷冬”吗。不久前联合国世界气象组织（WMO）预计当前拉尼娜事件，将持续至2022年冬季，这将是21世纪首次出现的“三重”拉尼娜现象。 什么是拉尼娜？“三重”拉尼娜 将对我国今冬天气造成哪些影响？周兵： 首先拉尼娜是指赤道中、东太平洋海表温度异常，出现大范围偏冷、且强度和持续时间达到一定条件的冷水现象。它属于自然现象，理。", "chars": 182, "start": 82.25}, {"title": "盐城黄海湿地——落潮留痕沙洲如画", "body": "在我国的黄海南部，有一片湿地——江苏盐城黄海湿地，目前不仅是世界上最大的海岸型湿地，也是世界上面积最大的辐射沙洲群。发布时间：2020年06月01日 文章出自：用户投稿 作者： 严正东。2019年7月5日，盐城黄海湿地（申报名称为“中国黄（渤）海候鸟栖息地（第一期）”）被列入世界自然遗产名录。）。真的想象不出。", "speech": "第 4 条，盐城黄海湿地——落潮留痕沙洲如画。在我国的黄海南部，有一片湿地——江苏盐城黄海湿地，目前不仅是世界上最大的海岸型湿地，也是世界上面积最大的辐射沙洲群。发布时间：2020年06月01日 文章出自：用户投稿 作者： 严正东。2019年7月5日，盐城黄海湿地（申报名称为“中国黄（渤）海候鸟栖息地（第一期）”）被列入世界自然遗产名录。）。真的想象不出。", "chars": 179, "start": 121.54}, {"title": "中国第一条民营铁路——个碧石铁路", "body": "发布时间：2020年01月06日 文章出自：用户投稿 作者： 赵艳青。她是全国轨距最窄的铁路；她是全国筑路时间最长的铁路；她是效益最显著的铁路；她是百年个碧石铁路！个碧石铁路是中国最早修筑的铁路之一，是中国唯一一条民营铁路，也是中国唯一一条轨距六十厘米的铁路。话说一九零三年，浪漫的法国人带着不浪漫的热兵器，气。", "speech": "第 5 条，中国第一条民营铁路——个碧石铁路。发布时间：2020年01月06日 文章出自：用户投稿 作者： 赵艳青。她是全国轨距最窄的铁路；她是全国筑路时间最长的铁路；她是效益最显著的铁路；她是百年个碧石铁路！个碧石铁路是中国最早修筑的铁路之一，是中国唯一一条民营铁路，也是中国唯一一条轨距六十厘米的铁路。话说一九零三年，浪漫的法国人带着不浪漫的热兵器，气。", "chars": 179, "start": 158.98}, {"title": "行走在邓家围屋，静听岁月的轻语", "body": "关于围屋，有讲不完的故事，写不完的诗。围屋，就像一个散落的城堡，在乡村，静静地矗立，默默地遥望。随着经济社会的快速发展，城镇化愈演愈烈，新宅在建，围屋在守望。发布时间：2019年05月13日 文章出自：用户投稿 作者： 杜建群。初夏的的午后，我寻寻觅觅，遇见了你清晰的纹路。你无声又无言，却告诉我那曾经的过往。", "speech": "第 6 条，行走在邓家围屋，静听岁月的轻语。关于围屋，有讲不完的故事，写不完的诗。围屋，就像一个散落的城堡，在乡村，静静地矗立，默默地遥望。随着经济社会的快速发展，城镇化愈演愈烈，新宅在建，围屋在守望。发布时间：2019年05月13日 文章出自：用户投稿 作者： 杜建群。初夏的的午后，我寻寻觅觅，遇见了你清晰的纹路。你无声又无言，却告诉我那曾经的过往。", "chars": 177, "start": 197.38}, {"title": "重庆：世界上唯一建在平行岭谷的大城市", "body": "重庆人向外地人介绍重庆时，常会略带几分自豪地用方言说“我们这里是山城”，而且还要将“山”字狠狠地拖出一个尾音来才过瘾。对于重庆人来说，爬坡上坎是再寻常不过的事情。在这里坐轻轨有着过山车一般的体验，这里的九楼换个面就是一楼……发布时间：2018年08月29日 文章出自：用户投稿 作者： 彭怀月。中国这么大，有山。", "speech": "第 7 条，重庆：世界上唯一建在平行岭谷的大城市。重庆人向外地人介绍重庆时，常会略带几分自豪地用方言说“我们这里是山城”，而且还要将“山”字狠狠地拖出一个尾音来才过瘾。对于重庆人来说，爬坡上坎是再寻常不过的事情。在这里坐轻轨有着过山车一般的体验，这里的九楼换个面就是一楼……发布时间：2018年08月29日 文章出自：用户投稿 作者： 彭怀月。中国这么大，有山。", "chars": 181, "start": 236.59}, {"title": "琥珀，带你穿越至远古的宝石", "body": "琥珀，也称虎魄，在传说中是一种由老虎魂魄结晶而成的宝石。数千万年的时光冲刷洗礼，让它绽放出神秘而温润的光芒。它的神秘与美丽，让世人赋予了许多传奇色彩，甚至于有一种颜色，是直接以琥珀命名的。发布时间：2019年11月05日 文章出自：用户投稿 作者： 田庄。从东半球的中国辽宁，到西半球的美国新泽西，从冰天雪地的。", "speech": "第 8 条，琥珀，带你穿越至远古的宝石。琥珀，也称虎魄，在传说中是一种由老虎魂魄结晶而成的宝石。数千万年的时光冲刷洗礼，让它绽放出神秘而温润的光芒。它的神秘与美丽，让世人赋予了许多传奇色彩，甚至于有一种颜色，是直接以琥珀命名的。发布时间：2019年11月05日 文章出自：用户投稿 作者： 田庄。从东半球的中国辽宁，到西半球的美国新泽西，从冰天雪地的。", "chars": 176, "start": 274.75}, {"title": "山南秘境勒布沟", "body": "如今去西藏已经不是难事儿，走过川藏线，赏过林芝桃花，朝圣过阿里神山，墙裂推荐大家去看看被遗忘的山南秘境这座藏源之地，有着国境线的喜马拉雅之南，竟然深藏着壮美的雪山，高山瀑布、鲜花满山的绝美风光。发布时间：2019年07月17日 文章出自：用户投稿 作者： 胡澍。当然除了秘境之外也有必备的打卡之地藏王第一宫雍布。", "speech": "第 9 条，山南秘境勒布沟。如今去西藏已经不是难事儿，走过川藏线，赏过林芝桃花，朝圣过阿里神山，墙裂推荐大家去看看被遗忘的山南秘境这座藏源之地，有着国境线的喜马拉雅之南，竟然深藏着壮美的雪山，高山瀑布、鲜花满山的绝美风光。发布时间：2019年07月17日 文章出自：用户投稿 作者： 胡澍。当然除了秘境之外也有必备的打卡之地藏王第一宫雍布。", "chars": 170, "start": 313.63}, {"title": "井盐与诺邓村", "body": "井盐，食盐的一种。诺邓村，又名诺邓井。井盐，从盐井汲取盐卤,设灶煎制而成。发布时间：2021年04月07日 文章出自：用户投稿 作者： 赵艳青。诺邓古村深藏于云南省大理州云龙县城北的大山中，是有着上千年厚重过往的白族村寨，村庄因盐业而生，因盐业而兴，长期煮盐贩盐，曾一度是滇西地区的经济重镇。西汉至南北朝时期。", "speech": "第 10 条，井盐与诺邓村。井盐，食盐的一种。诺邓村，又名诺邓井。井盐，从盐井汲取盐卤,设灶煎制而成。发布时间：2021年04月07日 文章出自：用户投稿 作者： 赵艳青。诺邓古村深藏于云南省大理州云龙县城北的大山中，是有着上千年厚重过往的白族村寨，村庄因盐业而生，因盐业而兴，长期煮盐贩盐，曾一度是滇西地区的经济重镇。西汉至南北朝时期。", "chars": 169, "start": 350.47}], "seconds": 391.4, "rate": "-3%", "file": "https://cdn.jsdelivr.net/gh/liuyang987695908-spec/mingjian-audio@main/audio/2026-11-12/geo.mp3?v=20261112081402", "backup": "audio/2026-11-12/geo.mp3?v=20261112081402"}, {"key": "history", "name": "历史", "emoji": "🏛️", "count": 12, "items": [{"title": "“中国”概念内涵在清代的拓展", "body": "“中国”作为一个承载着数千年历史记忆、文化传承与疆域认同的核心概念，其内涵随着历代王朝的更迭、疆域的拓展与民族融合的深化而不断演进，但始终保持着内在的历史连续性与文化同一性。自先秦时期产生“中国”概念以来，历经秦汉大一统王朝的定型、隋唐宋元的拓展，至明清时期逐步演变为涵盖多民族、广疆域的统一主权国家概念，这一。这条来自中国社会科学网·历史学。", "speech": "第 1 条，“中国”概念内涵在清代的拓展。“中国”作为一个承载着数千年历史记忆、文化传承与疆域认同的核心概念，其内涵随着历代王朝的更迭、疆域的拓展与民族融合的深化而不断演进，但始终 泛参与中国的社会变革。此时，他们又以政治协商的方式参与新中国的创建。华侨华人在中国现代化进程中的作用，既体现为资金、知识和人。这条来自中国社会科学网·历史学。", "chars": 198, "start": 380.59}, {"title": "八千年前裴李岗人的日常", "body": "武笑迎 2026-09-17 来源：《人民日报》（2026年09月14日 第15版）。8000年前的中原先民过着怎样的生活？最新考古发现表明，裴李岗人的生活远比想象的更加精致、丰富。8000年前的中原地区，裴李岗人告别了纯粹的采集渔猎，建立起粟、黍、稻并存的混作农业。水稻的地位尤为特殊——既是可以填饱肚子的粮。这条来自国家人文历史。", "speech": "第 11 条，八千年前裴李岗人的日常。武笑迎 2026-09-17 来源：《人民日报》（2026年09月14日 第15版）。8000年前的中原先民过着怎样的生活？最新考古发现表明，裴李岗人的生活远比想象的更加精致、丰富。8000年前的中原地区，裴李岗人告别了纯粹的采集渔猎，建立起粟、黍、稻并存的混作农业。水稻的地位尤为特殊——既是可以填饱肚子的粮。这条来自国家人文历史。", "chars": 186, "start": 426.38}, {"title": "群山之间，寻找远古的文明印记", "body": "焦思雨 2026-09-17 来源：《人民日报》（2026年09月16日 第11版）。绵延200余公里的贺兰山，雄浑壮阔，横亘于宁夏平原西缘。群山之间，远古先民以石为纸、以凿为笔，留下了数以万计的岩画遗存，无声诉说着数千年前的文明星火。近日，工作人员在岩画系统复查中，发现一幅罕见的“四马拉车”岩画——这是贺兰。", "speech": "第 12 条，群山之间，寻找远古的文明印记。焦思雨 2026-09-17 来源：《人民日报》（2026年09月16日 第11版）。绵延200余公里的贺兰山，雄浑壮阔，横亘于宁夏平原西缘。群山之间，远古先民以石为纸、以凿为笔，留下了数以万计的岩画遗存，无声诉说着数千年前的文明星火。近日，工作人员在岩画系统复查中，发现一幅罕见的“四马拉车”岩画——这是贺兰。", "chars": 178, "start": 465.6}], "seconds": 505.1, "rate": "-3%", "file": "https://cdn.jsdelivr.net/gh/liuyang987695908-spec/mingjian-audio@main/audio/2026-11-12/history.mp3?v=20261112081402", "backup": "audio/2026-11-12/history.mp3?v=20261112081402"}]};
const KEY = "mingjian-" + DATA.date;
const audio = document.getElementById("audio");
let index = -1, allMode = false;

function fmt(s){s=Math.max(0,Math.floor(s||0));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function saved(){try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){return null}}
function save(){if(index<0)return;localStorage.setItem(KEY,JSON.stringify({i:index,t:audio.currentTime}));}

const list = document.getElementById("list");
DATA.sections.forEach((s,i)=>{
  const box=document.createElement("div");
  const row=document.createElement("div");row.className="row";
  row.innerHTML='<div class="name">'+s.emoji+" "+s.name
    +'<div class="meta" id="meta'+i+'">'+s.count+" 条 · 时长读取中</div></div><button>播放</button>";
  row.querySelector("button").onclick=()=>{play(i,false)};
  const det=document.createElement("details");
  det.innerHTML="<summary>本板块讲稿（"+s.count+" 条，可边听边看）</summary><div class='tr'>"
    +s.items.map((it,k)=>'<div class="ti" data-sec="'+i+'" data-i="'+k+'">'
      +'<div class="ts">'+fmt(it.start)+'</div><div class="tx"><b>'+it.title+'</b>'
      +(it.body?'<p>'+it.body+'</p>':'')+'</div></div>').join("")+"</div>";
  det.querySelectorAll(".ti").forEach(el=>{
    el.onclick=()=>{const sec=parseInt(el.dataset.sec),k=parseInt(el.dataset.i);
      const it=DATA.sections[sec].items[k];
      if(index!==sec||allMode){play(sec,false);}
      audio.currentTime=it.start;};
  });
  box.appendChild(row);box.appendChild(det);
  if(i<DATA.sections.length-1)box.style.borderBottom="1px solid var(--line)";
  list.appendChild(box);
});

function mark(i){document.querySelectorAll(".row").forEach((r,n)=>r.classList.toggle("on",n===i));}
function play(i,all){
  index=i;allMode=all;audio.src=DATA.sections[i].file;
  audio.dataset.backup=DATA.sections[i].backup||"";audio.dataset.trying=DATA.sections[i].file;
  const p=audio.play();
  if(p&&p.catch){p.catch(function(){document.getElementById("toggle").textContent="▶ 点此播放";});}
  mark(i);document.getElementById("nowTitle").textContent=DATA.sections[i].emoji+" "+DATA.sections[i].name;
  document.getElementById("mode").textContent=all?"全部连播":"单板块";
  document.getElementById("toggle").textContent="⏸";
}
audio.addEventListener("error",function(){
  const b=audio.dataset.backup;
  if(b&&audio.dataset.trying!==b){audio.dataset.trying=b;audio.src=b;audio.play().catch(function(){});}
});
function next(){if(index+1<DATA.sections.length){play(index+1,true)}else{allMode=false;document.getElementById("toggle").textContent="▶";}}
audio.addEventListener("ended",()=>{if(allMode)next();else document.getElementById("toggle").textContent="▶";});
let tick=0;
audio.addEventListener("timeupdate",()=>{
  document.getElementById("nowTime").textContent=fmt(audio.currentTime)+" / "+fmt(audio.duration);
  if(audio.duration)document.getElementById("seek").value=(audio.currentTime/audio.duration)*100;
  if(++tick%4===0){save();highlight();}
});
function highlight(){
  const sec=DATA.sections[index];if(!sec)return;
  let cur=-1;for(let k=0;k<sec.items.length;k++){if(audio.currentTime>=sec.items[k].start)cur=k;else break;}
  document.querySelectorAll(".ti.live").forEach(e=>e.classList.remove("live"));
  if(cur>=0){const el=document.querySelector('.ti[data-sec="'+index+'"][data-i="'+cur+'"]');
    if(el){el.classList.add("live");}}
}
audio.addEventListener("loadedmetadata",()=>{
  if(index>=0)document.getElementById("meta"+index).textContent=DATA.sections[index].count+" 条 · "+fmt(audio.duration);
});
audio.addEventListener("pause",save);
document.getElementById("playAll").onclick=()=>play(0,true);
document.getElementById("toggle").onclick=()=>{
  if(index<0){play(0,true);return}
  if(audio.paused){audio.play();document.getElementById("toggle").textContent="⏸"}
  else{audio.pause();document.getElementById("toggle").textContent="▶"}
};
document.getElementById("prev").onclick=()=>{if(index>0)play(index-1,allMode)};
document.getElementById("next").onclick=()=>{if(index+1<DATA.sections.length)play(index+1,allMode)};
document.getElementById("seek").oninput=e=>{if(audio.duration)audio.currentTime=audio.duration*e.target.value/100};
document.getElementById("resumeBtn").onclick=()=>{const s=saved();if(s){play(s.i,true);audio.currentTime=s.t||0;document.getElementById("resume").style.display="none";}};
document.getElementById("forgetBtn").onclick=()=>{localStorage.removeItem(KEY);document.getElementById("resume").style.display="none";play(0,true)};
(function(){const s=saved();if(s&&s.i<DATA.sections.length){
  document.getElementById("resumeText").innerHTML="上次听到 <b>"+DATA.sections[s.i].emoji+" "
    +DATA.sections[s.i].name+"</b> 的 "+fmt(s.t)+" 处";
  document.getElementById("resume").style.display="block";}})();
(function(){const h=(location.hash||"").replace("#","");if(!h)return;
  const i=DATA.sections.findIndex(s=>s.key===h);if(i>=0)play(i,false);})();
</script></body></html>
