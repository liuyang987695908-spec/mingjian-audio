<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>铭鉴早报 · 2026-10-17 语音版</title>
<style>
:root{--bg:#0f1115;--card:#181b21;--line:#262a33;--fg:#e8eaed;--dim:#9aa0a6;--accent:#4c8dff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px 14px 120px}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:19px;margin:6px 0 2px}
.sub{color:var(--dim);font-size:13px;margin-bottom:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.resume{display:none;background:linear-gradient(135deg,#1d2b4d,#182031);border-color:#2b4a86}
.resume b{color:var(--accent)}
button{font:inherit;color:var(--fg);background:#232833;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
button:active{transform:scale(.98)}
.big{width:100%;background:var(--accent);border-color:var(--accent);font-weight:600;font-size:16px;padding:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .name{flex:1;font-size:15px}
.row .meta{color:var(--dim);font-size:12px;margin-top:3px}
.row button{padding:8px 14px;border-radius:20px;background:#2a3040}
.row.on .name{color:var(--accent)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#12151b;border-top:1px solid var(--line);padding:10px 14px 14px}
.bar .inner{max-width:640px;margin:0 auto}
.bar .top{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:6px}
input[type=range]{width:100%;accent-color:var(--accent)}
.ctl{display:flex;align-items:center;gap:10px;margin-top:8px}
.ctl .t{color:var(--dim);font-size:12px;flex:1;text-align:right}
details{margin-top:10px}
summary{color:var(--dim);font-size:13px;cursor:pointer}
ol{margin:8px 0 0 18px;padding:0;color:var(--dim);font-size:13px;line-height:1.7}
</style></head>
<body><div class="wrap">
<h1>🎧 铭鉴早报 · 2026-10-17 语音版</h1>
<div class="sub">分板块收听，或点「全部播放」一次听完 · 自动记住上次听到的位置</div>
<div class="panel resume" id="resume"><span id="resumeText"></span>
  <div style="margin-top:10px"><button id="resumeBtn">继续上次</button>
  <button id="forgetBtn">从头开始</button></div></div>
<div class="panel"><button class="big" id="playAll">▶ 全部播放（约 约 7 分钟）</button></div>
<div class="panel" id="list"></div>
<div class="panel"><details><summary>查看本次讲稿要点</summary><div id="titles"></div></details></div>
</div>
<div class="bar"><div class="inner">
  <div class="top"><span id="nowTitle">未播放</span><span id="nowTime">00:00 / 00:00</span></div>
  <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
  <div class="ctl">
    <button id="prev">⏮</button><button id="toggle">▶</button><button id="next">⏭</button>
    <span class="t" id="mode">单板块</span>
  </div>
</div></div>
<audio id="audio" preload="metadata"></audio>
<script>
const DATA = {"date": "2026-10-17", "sections": [{"key": "tech", "name": "科技", "emoji": "🔬", "count": 10, "file": "https://cdn.jsdelivr.net/gh/liuyang987695908-spec/mingjian-audio@main/audio/2026-10-17/tech.mp3", "backup": "audio/2026-10-17/tech.mp3", "titles": ["消息称三星 SDI 最快 2027 年 6 月量产 AI 服务器备用 LFP", "本周看什么 | 最近值得一看的 13 部作品", "早报｜iPhone Duo开启预购，发货排到明年/特斯拉超跑发布会现场飞了/", "OpenAI 再挖马斯克墙角，聘请 xAI 前销售负责人承担网安业务销售工作", "「弯道超车」赛车入门指北 05：让赛车粉身碎骨，才是保命的真正方式", "预售 16.98 万元起，MONA L05 攻入小鹏主品牌腹地", "Win11 首个原生支持“锁定隐私浏览”的浏览器：Firefox 可自动上锁", "一面专注体验，一面表达个性：麦金獭钢化膜与极稚墨水屏手机壳体验", "英伟达RTX Spark笔记本首发实测，我实现了WorkBuddy额度自由", "唯卓仕 AF 26mm F2.8 EVO 索尼 FE 卡口镜头新增雾月银、岩"]}, {"key": "culture", "name": "人文", "emoji": "🎭", "count": 10, "file": "https://cdn.jsdelivr.net/gh/liuyang987695908-spec/mingjian-audio@main/audio/2026-10-17/culture.mp3", "backup": "audio/2026-10-17/culture.mp3", "titles": ["超200万人预约“史上最贵iPhone”：手机为何越卖越少，却越卖越贵？", "从“拼产能”到“拼精品” AI文旅互动剧为流量短剧“降温”", "历史上的今天｜1919年10月17日，南开大学在天津成立", "哈尔滨芭蕾舞团原创芭蕾舞剧《我们的北大荒》建组启动", "全国即将进入省级党代会时间", "百余幅诗歌珍贵手稿在沪展出", "见微知沪｜00后医疗护理员落户上海，释放了什么信号？", "大型音·舞·诗晚会《长征之路》第二轮公演在穗举行", "数据告诉你，好戏为什么都来上海", "短短一周内，两位中国女演员斩获国际荣誉"]}, {"key": "book", "name": "书籍", "emoji": "📚", "count": 10, "file": "https://cdn.jsdelivr.net/gh/liuyang987695908-spec/mingjian-audio@main/audio/2026-10-17/book.mp3", "backup": "audio/2026-10-17/book.mp3", "titles": ["万物源起", "落在我身上的雨", "让无权无势者有力：齐格蒙特·鲍曼谈社会学", "无论如何，潜水", "空地", "爱的辛劳：一名心理咨询师见证的欲望、创伤与人间", "痛！：随机图书馆03", "啸风山庄（插图袖珍本）", "家奴的边界：宦官与北宋统治秩序", "恐龙的移动轨迹"]}, {"key": "music", "name": "音乐", "emoji": "🎵", "count": 10, "file": "https://cdn.jsdelivr.net/gh/liuyang987695908-spec/mingjian-audio@main/audio/2026-10-17/music.mp3", "backup": "audio/2026-10-17/music.mp3", "titles": ["我不难过", "NEON", "光·影", "天龙八部之宿敌", "SUPERSTAR", "火种", "你不要那样看着我的眼睛", "各凭本事闯天地", "Dear my crazy soulmate", "VIBE"]}, {"key": "hot", "name": "实时热点", "emoji": "🔥", "count": 10, "file": "https://cdn.jsdelivr.net/gh/liuyang987695908-spec/mingjian-audio@main/audio/2026-10-17/hot.mp3", "backup": "audio/2026-10-17/hot.mp3", "titles": ["92%的在岗班主任不愿意继续干了", "特斯拉为啥要造一款会「飞」的汽车？", "阿达西的馕真是馕界楷模", "女子在自己手机上登录前男友账号以「1314」等金额转走近二十万，法院判决全部", "喀纳斯秋日实况", "暴雨、大暴雨！中央气象台三预警齐发", "德国一机器人涉嫌猥亵 16 岁少女，警方调查疑系机器人主人远程操控，案件调查", "广交会见证中国制造从能造到智造", "25 岁伊藤美诚近 12 年首次无缘日本队序列，清空乒乓内容、删掉运动员身份", "一块会飞上天的滑板简直太酷了"]}]};
const KEY = "mingjian-" + DATA.date;
const audio = document.getElementById("audio");
let index = -1, allMode = false;

function fmt(s){s=Math.max(0,Math.floor(s||0));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function saved(){try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){return null}}
function save(){if(index<0)return;localStorage.setItem(KEY,JSON.stringify({i:index,t:audio.currentTime}));}

const list = document.getElementById("list");
DATA.sections.forEach((s,i)=>{
  const row=document.createElement("div");row.className="row";row.id="row"+i;
  row.innerHTML='<div class="name">'+s.emoji+" "+s.name+'<div class="meta" id="meta'+i+'">'
    +s.count+" 条 · 时长读取中</div></div><button>播放</button>";
  row.querySelector("button").onclick=()=>{play(i,false)};
  const det=document.createElement("div");det.innerHTML='<div class="name" style="padding:6px 0 0">'
    +'<details><summary>本板块 '+s.count+' 条要点</summary><ol>'
    +s.titles.map(t=>"<li>"+t+"</li>").join("")+'</ol></details></div>';
  const wrap=document.createElement("div");wrap.appendChild(row);wrap.appendChild(det);
  list.appendChild(wrap);
});
const box=document.getElementById("titles");
DATA.sections.forEach(s=>{
  const h=document.createElement("div");h.style.marginTop="10px";
  h.innerHTML="<b>"+s.emoji+" "+s.name+"</b><ol>"+s.titles.map(t=>"<li>"+t+"</li>").join("")+"</ol>";
  box.appendChild(h);
});

function mark(i){
  document.querySelectorAll(".row").forEach((r,n)=>r.classList.toggle("on",n===i));
}
function play(i,all){
  index=i;allMode=all;audio.src=DATA.sections[i].file;
  audio.dataset.backup=DATA.sections[i].backup||"";audio.dataset.trying=DATA.sections[i].file;
  const p=audio.play();
  if(p&&p.catch){p.catch(function(){document.getElementById("toggle").textContent="▶ 点此播放";});}
  mark(i);document.getElementById("nowTitle").textContent=DATA.sections[i].emoji+" "+DATA.sections[i].name;
  document.getElementById("mode").textContent=all?"全部连播":"单板块";
  document.getElementById("toggle").textContent="⏸";
}
audio.addEventListener("error",function(){
  const b=audio.dataset.backup;
  if(b&&audio.dataset.trying!==b){audio.dataset.trying=b;audio.src=b;audio.play().catch(function(){});}
});
function next(){if(index+1<DATA.sections.length){play(index+1,true)}else{allMode=false;document.getElementById("toggle").textContent="▶";}}
audio.addEventListener("ended",()=>{if(allMode)next();else document.getElementById("toggle").textContent="▶";});
audio.addEventListener("timeupdate",()=>{
  document.getElementById("nowTime").textContent=fmt(audio.currentTime)+" / "+fmt(audio.duration);
  if(audio.duration)document.getElementById("seek").value=(audio.currentTime/audio.duration)*100;
  if(Math.floor(audio.currentTime)%5===0)save();
});
audio.addEventListener("loadedmetadata",()=>{
  if(index>=0)document.getElementById("meta"+index).textContent=DATA.sections[index].count+" 条 · "+fmt(audio.duration);
});
audio.addEventListener("pause",save);
document.getElementById("playAll").onclick=()=>play(0,true);
document.getElementById("toggle").onclick=()=>{
  if(index<0){play(0,true);return}
  if(audio.paused){audio.play();document.getElementById("toggle").textContent="⏸"}
  else{audio.pause();document.getElementById("toggle").textContent="▶"}
};
document.getElementById("prev").onclick=()=>{if(index>0)play(index-1,allMode)};
document.getElementById("next").onclick=()=>{if(index+1<DATA.sections.length)play(index+1,allMode)};
document.getElementById("seek").oninput=e=>{if(audio.duration)audio.currentTime=audio.duration*e.target.value/100};
document.getElementById("resumeBtn").onclick=()=>{const s=saved();if(s){play(s.i,true);audio.currentTime=s.t||0;document.getElementById("resume").style.display="none";}};
document.getElementById("forgetBtn").onclick=()=>{localStorage.removeItem(KEY);document.getElementById("resume").style.display="none";play(0,true)};
(function(){const s=saved();if(s&&s.i<DATA.sections.length){
  document.getElementById("resumeText").innerHTML="上次听到 <b>"+DATA.sections[s.i].emoji+" "
    +DATA.sections[s.i].name+"</b> 的 "+fmt(s.t)+" 处";
  document.getElementById("resume").style.display="block";}})();
(function(){const h=(location.hash||"").replace("#","");if(!h)return;
  const i=DATA.sections.findIndex(s=>s.key===h);if(i>=0)play(i,false);})();
</script></body></html>
