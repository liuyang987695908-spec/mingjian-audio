 44.21}, {"title": "“三重”拉尼娜，这个冬天会是“冷冬”吗", "body": "不久前联合国世界气象组织（WMO）预计当前拉尼娜事件，将持续至2022年冬季，这将是21世纪首次出现的“三重”拉尼娜现象。 什么是拉尼娜？“三重”拉尼娜 将对我国今冬天气造成哪些影响？周兵： 首先拉尼娜是指赤道中、东太平洋海表温度异常，出现大范围偏冷、且强度和持续时间达到一定条件的冷水现象。它属于自然现象，理。", "speech": "第 3 条，“三重”拉尼娜，这个冬天会是“冷冬”吗。不久前联合国世界气象组织（WMO）预计当前拉尼娜事件，将持续至2022年冬季，这将是21世纪首次出现的“三重”拉尼娜现象。 什么是拉尼娜？“三重”拉尼娜 将对我国今冬天气造成哪些影响？周兵： 首先拉尼娜是指赤道中、东太平洋海表温度异常，出现大范围偏冷、且强度和持续时间达到一定条件的冷水现象。它属于自然现象，理。", "chars": 182, "start": 83.98}, {"title": "盐城黄海湿地——落潮留痕沙洲如画", "body": "在我国的黄海南部，有一片湿地——江苏盐城黄海湿地，目前不仅是世界上最大的海岸型湿地，也是世界上面积最大的辐射沙洲群。发布时间：2020年06月01日 文章出自：用户投稿 作者： 严正东。2019年7月5日，盐城黄海湿地（申报名称为“中国黄（渤）海候鸟栖息地（第一期）”）被列入世界自然遗产名录。）。真的想象不出。", "speech": "第 4 条，盐城黄海湿地——落潮留痕沙洲如画。在我国的黄海南部，有一片湿地——江苏盐城黄海湿地，目前不仅是世界上最大的海岸型湿地，也是世界上面积最大的辐射沙洲群。发布时间：2020年06月01日 文章出自：用户投稿 作者： 严正东。2019年7月5日，盐城黄海湿地（申报名称为“中国黄（渤）海候鸟栖息地（第一期）”）被列入世界自然遗产名录。）。真的想象不出。", "chars": 179, "start": 124.08}, {"title": "中国第一条民营铁路——个碧石铁路", "body": "发布时间：2020年01月06日 文章出自：用户投稿 作者： 赵艳青。她是全国轨距最窄的铁路；她是全国筑路时间最长的铁路；她是效益最显著的铁路；她是百年个碧石铁路！个碧石铁路是中国最早修筑的铁路之一，是中国唯一一条民营铁路，也是中国唯一一条轨距六十厘米的铁路。话说一九零三年，浪漫的法国人带着不浪漫的热兵器，气。", "speech": "第 5 条，中国第一条民营铁路——个碧石铁路。发布时间：2020年01月06日 文章出自：用户投稿 作者： 赵艳青。她是全国轨距最窄的铁路；她是全国筑路时间最长的铁路；她是效益最显著的铁路；她是百年个碧石铁路！个碧石铁路是中国最早修筑的铁路之一，是中国唯一一条民营铁路，也是中国唯一一条轨距六十厘米的铁路。话说一九零三年，浪漫的法国人带着不浪漫的热兵器，气。", "chars": 179, "start": 162.31}, {"title": "行走在邓家围屋，静听岁月的轻语", "body": "关于围屋，有讲不完的故事，写不完的诗。围屋，就像一个散落的城堡，在乡村，静静地矗立，默默地遥望。随着经济社会的快速发展，城镇化愈演愈烈，新宅在建，围屋在守望。发布时间：2019年05月13日 文章出自：用户投稿 作者： 杜建群。初夏的的午后，我寻寻觅觅，遇见了你清晰的纹路。你无声又无言，却告诉我那曾经的过往。", "speech": "第 6 条，行走在邓家围屋，静听岁月的轻语。关于围屋，有讲不完的故事，写不完的诗。围屋，就像一个散落的城堡，在乡村，静静地矗立，默默地遥望。随着经济社会的快速发展，城镇化愈演愈烈，新宅在建，围屋在守望。发布时间：2019年05月13日 文章出自：用户投稿 作者： 杜建群。初夏的的午后，我寻寻觅觅，遇见了你清晰的纹路。你无声又无言，却告诉我那曾经的过往。", "chars": 177, "start": 201.5}, {"title": "重庆：世界上唯一建在平行岭谷的大城市", "body": "重庆人向外地人介绍重庆时，常会略带几分自豪地用方言说“我们这里是山城”，而且还要将“山”字狠狠地拖出一个尾音来才过瘾。对于重庆人来说，爬坡上坎是再寻常不过的事情。在这里坐轻轨有着过山车一般的体验，这里的九楼换个面就是一楼……发布时间：2018年08月29日 文章出自：用户投稿 作者： 彭怀月。中国这么大，有山。", "speech": "第 7 条，重庆：世界上唯一建在平行岭谷的大城市。重庆人向外地人介绍重庆时，常会略带几分自豪地用方言说“我们这里是山城”，而且还要将“山”字狠狠地拖出一个尾音来才过瘾。对于重庆 度、下游河槽的一轮冲刷。亿万粒泥沙经年累月，足以抬高河床、改变河道，甚至在河口处塑造新的土地。水能挟沙入海，沙亦可淤河成灾，黄河水沙关系。", "speech": "第 6 条，水与沙的辩证法：千百年来的中国治河智慧。关禾 2026-10-30 来源：人民日报中央厨房-博古知今工作室。黄河入海处，水流舒展，泥沙渐次沉落。一粒泥沙的行程，可能关系着黄土高原的一场降雨，也贯通着中游水库的一次调度、下游河槽的一轮冲刷。亿万粒泥沙经年累月，足以抬高河床、改变河道，甚至在河口处塑造新的土地。水能挟沙入海，沙亦可淤河成灾，黄河水沙关系。", "chars": 182, "start": 225.79}, {"title": "人工智能时代，历史学如何认识自身", "body": "当下，历史学正在经历第四次重大革命——书写者革命，即AI与人类共同成为历史学的书写者，史学研究者的存在合理性首次受到严重质疑，历史学的本质、边界与价值随之迎来新一轮审视。回顾历史学的发展历程，第一次重大革命可称作书写革命，是指历史从口传、记忆转变为文字、文本的过程，解决了历史如何被记录、早期历史学何以诞生的问。这条来自中国社会科学网·历史学。", "speech": "第 7 条，人工智能时代，历史学如何认识自身。当下，历史学正在经历第四次重大革命——书写者革命，即AI与人类共同成为历史学的书写者，史学研究者的存在合理性首次受到严重质疑，历史学的本质、边界与价值随之迎来新一轮审视。回顾历史学的发展历程，第一次重大革命可称作书写革命，是指历史从口传、记忆转变为文字、文本的过程，解决了历史如何被记录、早期历史学何以诞生的问。这条来自中国社会科学网·历史学。", "chars": 195, "start": 266.88}, {"title": "秦始皇“奶奶”的陵墓被发现了？里面有什么", "body": "陕西咸阳原厚重的黄土之下，诸多秦国国君与他们的家人长眠于此。原载于国家人文历史微信公众号（ID：gjrwls），未经授权请勿转载。陕西咸阳的原野上坐落着一座座巍峨的封土，千百年风吹雨打，静静矗立。后世百姓望着这些土堆，凭着世代口耳相传，错把它们认作周文王、周武王的周王陵，也有不少被归为汉家古冢。这流传千年的误。这条来自国家人文历史。", "speech": "第 8 条，秦始皇“奶奶”的陵墓被发现了？里面有什么。陕西咸阳原厚重的黄土之下，诸多秦国国君与他们的家人长眠于此。原载于国家人文历史微信公众号（ID：gjrwls），未经授权请勿转载。陕西咸阳的原野上坐落着一座座巍峨的封土，千百年风吹雨打，静静矗立。后世百姓望着这些土堆，凭着世代口耳相传，错把它们认作周文王、周武王的周王陵，也有不少被归为汉家古冢。这流传千年的误。这条来自国家人文历史。", "chars": 194, "start": 311.71}, {"title": "人工智能赋能史学研究的两条路径", "body": "近年来，人工智能与历史学的关系日益受到学术界关注，围绕大语言模型的讨论尤为集中。人工智能在史学应用中存在生成错误知识、削弱学者主体性、模糊原创边界等问题，应受到重视。但如果讨论长期停留在人工智能“会不会替代”等层面，则易将人工智能视为史学研究的外部威胁，忽视其已经引发及可能进一步带来的变化。人工智能未必改变历。这条来自中国社会科学网·历史学。", "speech": "第 9 条，人工智能赋能史学研究的两条路径。近年来，人工智能与历史学的关系日益受到学术界关注，围绕大语言模型的讨论尤为集中。人工智能在史学应用中存在生成错误知识、削弱学者主体性、模糊原创边界等问题，应受到重视。但如果讨论长期停留在人工智能“会不会替代”等层面，则易将人工智能视为史学研究的外部威胁，忽视其已经引发及可能进一步带来的变化。人工智能未必改变历。这条来自中国社会科学网·历史学。", "chars": 194, "start": 356.18}, {"title": "长征文物，照见胜利之源", "body": "黄黎 2026-09-22 来源：《人民日报》（2026年09月19日 第08版）。陈毅《游击战争纪实》即《赣南游击词》20世纪60年代修改手稿。以上图片均为中国国家博物馆提供。中国国家博物馆的展柜中，几件革命文物静静陈列。90年前那场震撼世界的远征，硝烟早已散尽，而这几件烽火岁月留存下来的寻常旧物，从不同维。这条来自国家人文历史。", "speech": "第 10 条，长征文物，照见胜利之源。黄黎 2026-09-22 来源：《人民日报》（2026年09月19日 第08版）。陈毅《游击战争纪实》即《赣南游击词》20世纪60年代修改手稿。以上图片均为中国国家博物馆提供。中国国家博物馆的展柜中，几件革命文物静静陈列。90年前那场震撼世界的远征，硝烟早已散尽，而这几件烽火岁月留存下来的寻常旧物，从不同维。这条来自国家人文历史。", "chars": 186, "start": 400.03}, {"title": "史学理论研究要面向“四个之问", "body": "习近平总书记在哲学社会科学工作座谈会上指出，“一切有理想、有抱负的哲学社会科学工作者都应该立时代之潮头、通古今之变化、发思想之先声，积极为党和人民述学立论、建言献策，担负起历史赋予的光荣使命”。史学理论研究肩负着认识历史、把握现实、引领未来的重要使命。坚持问题导向，是推动史学理论创新发展的现实动力，也是科学回。这条来自中国社会科学网·历史学。", "speech": "第 11 条，史学理论研究要面向“四个之问。习近平总书记在哲学社会科学工作座谈会上指出，“一切有理想、有抱负的哲学社会科学工作者都应该立时代之潮头、通古今之变化、发思想之先声，积极为党和人民述学立论、建言献策，担负起历史赋予的光荣使命”。史学理论研究肩负着认识历史、把握现实、引领未来的重要使命。坚持问题导向，是推动史学理论创新发展的现实动力，也是科学回。这条来自中国社会科学网·历史学。", "chars": 194, "start": 441.19}, {"title": "八千年前裴李岗人的日常", "body": "武笑迎 2026-09-17 来源：《人民日报》（2026年09月14日 第15版）。8000年前的中原先民过着怎样的生活？最新考古发现表明，裴李岗人的生活远比想象的更加精致、丰富。8000年前的中原地区，裴李岗人告别了纯粹的采集渔猎，建立起粟、黍、稻并存的混作农业。水稻的地位尤为特殊——既是可以填饱肚子的粮。这条来自国家人文历史。", "speech": "第 12 条，八千年前裴李岗人的日常。武笑迎 2026-09-17 来源：《人民日报》（2026年09月14日 第15版）。8000年前的中原先民过着怎样的生活？最新考古发现表明，裴李岗人的生活远比想象的更加精致、丰富。8000年前的中原地区，裴李岗人告别了纯粹的采集渔猎，建立起粟、黍、稻并存的混作农业。水稻的地位尤为特殊——既是可以填饱肚子的粮。这条来自国家人文历史。", "chars": 186, "start": 484.85}], "seconds": 527.2, "rate": "-5%", "file": "https://cdn.jsdelivr.net/gh/liuyang987695908-spec/mingjian-audio@main/audio/2026-11-10/history.mp3?v=20261110080257", "backup": "audio/2026-11-10/history.mp3?v=20261110080257"}]};
const KEY = "mingjian-" + DATA.date;
const audio = document.getElementById("audio");
let index = -1, allMode = false;

function fmt(s){s=Math.max(0,Math.floor(s||0));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function saved(){try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){return null}}
function save(){if(index<0)return;localStorage.setItem(KEY,JSON.stringify({i:index,t:audio.currentTime}));}

const list = document.getElementById("list");
DATA.sections.forEach((s,i)=>{
  const box=document.createElement("div");
  const row=document.createElement("div");row.className="row";
  row.innerHTML='<div class="name">'+s.emoji+" "+s.name
    +'<div class="meta" id="meta'+i+'">'+s.count+" 条 · 时长读取中</div></div><button>播放</button>";
  row.querySelector("button").onclick=()=>{play(i,false)};
  const det=document.createElement("details");
  det.innerHTML="<summary>本板块讲稿（"+s.count+" 条，可边听边看）</summary><div class='tr'>"
    +s.items.map((it,k)=>'<div class="ti" data-sec="'+i+'" data-i="'+k+'">'
      +'<div class="ts">'+fmt(it.start)+'</div><div class="tx"><b>'+it.title+'</b>'
      +(it.body?'<p>'+it.body+'</p>':'')+'</div></div>').join("")+"</div>";
  det.querySelectorAll(".ti").forEach(el=>{
    el.onclick=()=>{const sec=parseInt(el.dataset.sec),k=parseInt(el.dataset.i);
      const it=DATA.sections[sec].items[k];
      if(index!==sec||allMode){play(sec,false);}
      audio.currentTime=it.start;};
  });
  box.appendChild(row);box.appendChild(det);
  if(i<DATA.sections.length-1)box.style.borderBottom="1px solid var(--line)";
  list.appendChild(box);
});

function mark(i){document.querySelectorAll(".row").forEach((r,n)=>r.classList.toggle("on",n===i));}
function play(i,all){
  index=i;allMode=all;audio.src=DATA.sections[i].file;
  audio.dataset.backup=DATA.sections[i].backup||"";audio.dataset.trying=DATA.sections[i].file;
  const p=audio.play();
  if(p&&p.catch){p.catch(function(){document.getElementById("toggle").textContent="▶ 点此播放";});}
  mark(i);document.getElementById("nowTitle").textContent=DATA.sections[i].emoji+" "+DATA.sections[i].name;
  document.getElementById("mode").textContent=all?"全部连播":"单板块";
  document.getElementById("toggle").textContent="⏸";
}
audio.addEventListener("error",function(){
  const b=audio.dataset.backup;
  if(b&&audio.dataset.trying!==b){audio.dataset.trying=b;audio.src=b;audio.play().catch(function(){});}
});
function next(){if(index+1<DATA.sections.length){play(index+1,true)}else{allMode=false;document.getElementById("toggle").textContent="▶";}}
audio.addEventListener("ended",()=>{if(allMode)next();else document.getElementById("toggle").textContent="▶";});
let tick=0;
audio.addEventListener("timeupdate",()=>{
  document.getElementById("nowTime").textContent=fmt(audio.currentTime)+" / "+fmt(audio.duration);
  if(audio.duration)document.getElementById("seek").value=(audio.currentTime/audio.duration)*100;
  if(++tick%4===0){save();highlight();}
});
function highlight(){
  const sec=DATA.sections[index];if(!sec)return;
  let cur=-1;for(let k=0;k<sec.items.length;k++){if(audio.currentTime>=sec.items[k].start)cur=k;else break;}
  document.querySelectorAll(".ti.live").forEach(e=>e.classList.remove("live"));
  if(cur>=0){const el=document.querySelector('.ti[data-sec="'+index+'"][data-i="'+cur+'"]');
    if(el){el.classList.add("live");}}
}
audio.addEventListener("loadedmetadata",()=>{
  if(index>=0)document.getElementById("meta"+index).textContent=DATA.sections[index].count+" 条 · "+fmt(audio.duration);
});
audio.addEventListener("pause",save);
document.getElementById("playAll").onclick=()=>play(0,true);
document.getElementById("toggle").onclick=()=>{
  if(index<0){play(0,true);return}
  if(audio.paused){audio.play();document.getElementById("toggle").textContent="⏸"}
  else{audio.pause();document.getElementById("toggle").textContent="▶"}
};
document.getElementById("prev").onclick=()=>{if(index>0)play(index-1,allMode)};
document.getElementById("next").onclick=()=>{if(index+1<DATA.sections.length)play(index+1,allMode)};
document.getElementById("seek").oninput=e=>{if(audio.duration)audio.currentTime=audio.duration*e.target.value/100};
document.getElementById("resumeBtn").onclick=()=>{const s=saved();if(s){play(s.i,true);audio.currentTime=s.t||0;document.getElementById("resume").style.display="none";}};
document.getElementById("forgetBtn").onclick=()=>{localStorage.removeItem(KEY);document.getElementById("resume").style.display="none";play(0,true)};
(function(){const s=saved();if(s&&s.i<DATA.sections.length){
  document.getElementById("resumeText").innerHTML="上次听到 <b>"+DATA.sections[s.i].emoji+" "
    +DATA.sections[s.i].name+"</b> 的 "+fmt(s.t)+" 处";
  document.getElementById("resume").style.display="block";}})();
(function(){const h=(location.hash||"").replace("#","");if(!h)return;
  const i=DATA.sections.findIndex(s=>s.key===h);if(i>=0)play(i,false);})();
</script></body></html>
