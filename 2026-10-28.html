音热点。", "speech": "第 8 条，中方敦促美方停止对古巴封锁施压。这条来自抖音热点。", "chars": 31, "start": 58.34}, {"title": "自媒体称澳大利亚每年花费巨额从中国进口屎壳郎，这是真吗？中国的屎壳郎真的如此兢兢业业、不挑", "body": "这条来自知乎热榜。", "speech": "第 9 条，自媒体称澳大利亚每年花费巨额从中国进口屎壳郎，这是真吗？中国的屎壳郎真的如此兢兢业业、不挑。这条来自知乎热榜。", "chars": 61, "start": 64.66}, {"title": "新闻联播", "body": "这条来自抖音热点。", "speech": "第 10 条，新闻联播。这条来自抖音热点。", "chars": 21, "start": 76.63}, {"title": "周星驰为什么再也拍不出《功夫》《大话西游》那样的经典电影了", "body": "这条来自知乎热榜。", "speech": "第 11 条，周星驰为什么再也拍不出《功夫》《大话西游》那样的经典电影了。这条来自知乎热榜。", "chars": 46, "start": 80.88}, {"title": "普京会晤伊朗总统讨论中东局势", "body": "这条来自抖音热点。", "speech": "第 12 条，普京会晤伊朗总统讨论中东局势。这条来自抖音热点。", "chars": 31, "start": 88.97}, {"title": "央媒称不认可皇马表态，此前皇马称姆巴佩仅代表个人，俱乐部和中国赞助商合作照常，皇马为何敢如", "body": "这条来自知乎热榜。", "speech": "第 13 条，央媒称不认可皇马表态，此前皇马称姆巴佩仅代表个人，俱乐部和中国赞助商合作照常，皇马为何敢如。这条来自知乎热榜。", "chars": 62, "start": 95.26}, {"title": "表演艺术家戈治均逝世", "body": "这条来自抖音热点。", "speech": "第 14 条，表演艺术家戈治均逝世。这条来自抖音热点。", "chars": 27, "start": 107.54}, {"title": "海信回应与皇马合作，称与皇马的赞助区域仅限西班牙地区，这样就能撇清关系吗", "body": "这条来自知乎热榜。", "speech": "第 15 条，海信回应与皇马合作，称与皇马的赞助区域仅限西班牙地区，这样就能撇清关系吗。这条来自知乎热榜。", "chars": 53, "start": 113.06}, {"title": "以色列议会选举投票结束", "body": "这条来自抖音热点。", "speech": "第 16 条，以色列议会选举投票结束。这条来自抖音热点。", "chars": 28, "start": 123.12}, {"title": "网传红果短剧预测营收超 400 亿，红果短剧已辟谣，如何评价其发展势头", "body": "这条来自知乎热榜。", "speech": "第 17 条，网传红果短剧预测营收超 400 亿，红果短剧已辟谣，如何评价其发展势头。这条来自知乎热榜。", "chars": 52, "start": 128.71}, {"title": "多国外交官感悟长征精神", "body": "这条来自抖音热点。", "speech": "第 18 条，多国外交官感悟长征精神。这条来自抖音热点。", "chars": 28, "start": 138.55}, {"title": "曝国产 TOP5 厂商将集体入局阔直板手机，这一形态会成为未来主流吗", "body": "这条来自知乎热榜。", "speech": "第 19 条，曝国产 TOP5 厂商将集体入局阔直板手机，这一形态会成为未来主流吗。这条来自知乎热榜。", "chars": 51, "start": 144.41}, {"title": "买一杯咖啡来敬重自己", "body": "这条来自抖音热点。", "speech": "第 20 条，买一杯咖啡来敬重自己。这条来自抖音热点。", "chars": 27, "start": 153.94}], "seconds": 161.8, "rate": "+12%", "file": "https://cdn.jsdelivr.net/gh/liuyang987695908-spec/mingjian-audio@main/audio/2026-10-28/hot.mp3?v=20261028193715", "backup": "audio/2026-10-28/hot.mp3?v=20261028193715"}, {"key": "geo", "name": "地理", "emoji": "🗺️", "count": 10, "items": [{"title": "四川，到底有啥好的", "body": "提起四川，你会想到什么呢？是“实现熊猫自由”的天府之国，还是大街小巷的麻辣鲜香，峨眉山、九寨沟、黄龙、若尔盖、稻城亚丁、泸沽湖.....在舌尖和眼球的双重刺激下，不忘再补上一句：四川，真的很巴适！都说四川好，但是四川到底好在哪里呢？。这条来自中国国家地理。", "speech": "第 1 条，四川，到底有啥好的。提起四川，你会想到什么呢？是“实现熊猫自由”的天府之国，还是大街小巷的麻辣鲜香，峨眉山、九寨沟、黄龙、若尔盖、稻城亚丁、泸沽湖.....在舌尖和眼球的双重刺激下，不忘再补上一句：四川，真的很巴适！都说四川好，但是四川到底好在哪里呢？。这条来自中国国家地理。", "chars": 144, "start": 3.24}, {"title": "“应天、顺天、承天、奉天”，历史上这“四大天府”，如今都在哪儿", "body": "这条来自国家人文历史·地理。", "speech": "第 2 条，“应天、顺天、承天、奉天”，历史上这“四大天府”，如今都在哪儿。这条来自国家人文历史·地理。", "chars": 52, "start": 29.74}, {"title": "黄河不黄了？是真的", "body": "在人们的印象中，黄河一直以含沙量高著称。自高原山地飞驰而下，黄河裹挟大量泥沙，在入海口淤积造就了大片陆地。与此同时，黄河中游失去了大量的肥沃土地和水资源，下游及其相邻地区也频繁遭受洪水灾害。这条来自中国国家地理。", "speech": "第 3 条，黄河不黄了？是真的。在人们的印象中，黄河一直以含沙量高著称。自高原山地飞驰而下，黄河裹挟大量泥沙，在入海口淤积造就了大片陆地。与此同时，黄河中游失去了大量的肥沃土地和水资源，下游及其相邻地区也频繁遭受洪水灾害。这条来自中国国家地理。", "chars": 122, "start": 39.43}, {"title": "这座长江边的小城，曾决定六个王朝的生死存亡", "body": "这条来自国家人文历史·地理。", "speech": "第 4 条，这座长江边的小城，曾决定六个王朝的生死存亡。这条来自国家人文历史·地理。", "chars": 42, "start": 64.15}, {"title": "“三重”拉尼娜，这个冬天会是“冷冬”吗", "body": "不久前联合国世界气象组织（WMO）预计当前拉尼娜事件，将持续至2022年冬季，这将是21世纪首次出现的“三重”拉尼娜现象。 什么是拉尼娜？“三重”拉尼娜 将对我国今冬天气造成哪些影响？。这条来自中国国家地理。", "speech": "第 5 条，“三重”拉尼娜，这个冬天会是“冷冬”吗。不久前联合国世界气象组织（WMO）预计当前拉尼娜事件，将持续至2022年冬季，这将是21世纪首次出现的“三重”拉尼娜现象。 什么是拉尼娜？“三重”拉尼娜 将对我国今冬天气造成哪些影响？。这条来自中国国家地理。", "chars": 130, "start": 72.38}, {"title": "广西人两万年前就吃螺蛳了", "body": "这条来自国家人文历史·地理。", "speech": "第 6 条，广西人两万年前就吃螺蛳了。这条来自国家人文历史·地理。", "chars": 33, "start": 96.02}, {"title": "盐城黄海湿地——落潮留痕沙洲如画", "body": "在我国的黄海南部，有一片湿地——江苏盐城黄海湿地，目前不仅是世界上最大的海岸型湿地，也是世界上面积最大的辐射沙洲群。这条来自中国国家地理。", "speech": "第 7 条，盐城黄海湿地——落潮留痕沙洲如画。在我国的黄海南部，有一片湿地——江苏盐城黄海湿地，目前不仅是世界上最大的海岸型湿地，也是世界上面积最大的辐射沙洲群。这条来自中国国家地理。", "chars": 92, "start": 102.53}, {"title": "为什么唐代的大姓韦姓，现在主要只在广西了", "body": "这条来自国家人文历史·地理。", "speech": "第 8 条，为什么唐代的大姓韦姓，现在主要只在广西了。这条来自国家人文历史·地理。", "chars": 41, "start": 120.17}, {"title": "中国第一条民营铁路——个碧石铁路", "body": "她是全国轨距最窄的铁路；她是全国筑路时间最长的铁路；她是效益最显著的铁路；她是百年个碧石铁路！。这条来自 为刘邦的未来之路筑牢了认知根基。这条来自国家人文历史。", "speech": "第 8 条，刘邦能力那么强，为什么之前一直一事无成。这十几年的经历看似空空荡荡，实则为刘邦的未来之路筑牢了认知根基。这条来自国家人文历史。", "chars": 69, "start": 91.37}, {"title": "史学理论研究要面向“四个之问", "body": "这条来自中国社会科学网·历史学。", "speech": "第 9 条，史学理论研究要面向“四个之问。这条来自中国社会科学网·历史学。", "chars": 37, "start": 104.69}, {"title": "秦始皇“奶奶”的陵墓被发现了？里面有什么", "body": "陕西咸阳原厚重的黄土之下，诸多秦国国君与他们的家人长眠于此。这条来自国家人文历史。", "speech": "第 10 条，秦始皇“奶奶”的陵墓被发现了？里面有什么。陕西咸阳原厚重的黄土之下，诸多秦国国君与他们的家人长眠于此。这条来自国家人文历史。", "chars": 69, "start": 112.03}], "seconds": 127.1, "rate": "+12%", "file": "https://cdn.jsdelivr.net/gh/liuyang987695908-spec/mingjian-audio@main/audio/2026-10-28/history.mp3?v=20261028193715", "backup": "audio/2026-10-28/history.mp3?v=20261028193715"}]};
const KEY = "mingjian-" + DATA.date;
const audio = document.getElementById("audio");
let index = -1, allMode = false;

function fmt(s){s=Math.max(0,Math.floor(s||0));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function saved(){try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){return null}}
function save(){if(index<0)return;localStorage.setItem(KEY,JSON.stringify({i:index,t:audio.currentTime}));}

const list = document.getElementById("list");
DATA.sections.forEach((s,i)=>{
  const box=document.createElement("div");
  const row=document.createElement("div");row.className="row";
  row.innerHTML='<div class="name">'+s.emoji+" "+s.name
    +'<div class="meta" id="meta'+i+'">'+s.count+" 条 · 时长读取中</div></div><button>播放</button>";
  row.querySelector("button").onclick=()=>{play(i,false)};
  const det=document.createElement("details");
  det.innerHTML="<summary>本板块讲稿（"+s.count+" 条，可边听边看）</summary><div class='tr'>"
    +s.items.map((it,k)=>'<div class="ti" data-sec="'+i+'" data-i="'+k+'">'
      +'<div class="ts">'+fmt(it.start)+'</div><div class="tx"><b>'+it.title+'</b>'
      +(it.body?'<p>'+it.body+'</p>':'')+'</div></div>').join("")+"</div>";
  det.querySelectorAll(".ti").forEach(el=>{
    el.onclick=()=>{const sec=parseInt(el.dataset.sec),k=parseInt(el.dataset.i);
      const it=DATA.sections[sec].items[k];
      if(index!==sec||allMode){play(sec,false);}
      audio.currentTime=it.start;};
  });
  box.appendChild(row);box.appendChild(det);
  if(i<DATA.sections.length-1)box.style.borderBottom="1px solid var(--line)";
  list.appendChild(box);
});

function mark(i){document.querySelectorAll(".row").forEach((r,n)=>r.classList.toggle("on",n===i));}
function play(i,all){
  index=i;allMode=all;audio.src=DATA.sections[i].file;
  audio.dataset.backup=DATA.sections[i].backup||"";audio.dataset.trying=DATA.sections[i].file;
  const p=audio.play();
  if(p&&p.catch){p.catch(function(){document.getElementById("toggle").textContent="▶ 点此播放";});}
  mark(i);document.getElementById("nowTitle").textContent=DATA.sections[i].emoji+" "+DATA.sections[i].name;
  document.getElementById("mode").textContent=all?"全部连播":"单板块";
  document.getElementById("toggle").textContent="⏸";
}
audio.addEventListener("error",function(){
  const b=audio.dataset.backup;
  if(b&&audio.dataset.trying!==b){audio.dataset.trying=b;audio.src=b;audio.play().catch(function(){});}
});
function next(){if(index+1<DATA.sections.length){play(index+1,true)}else{allMode=false;document.getElementById("toggle").textContent="▶";}}
audio.addEventListener("ended",()=>{if(allMode)next();else document.getElementById("toggle").textContent="▶";});
let tick=0;
audio.addEventListener("timeupdate",()=>{
  document.getElementById("nowTime").textContent=fmt(audio.currentTime)+" / "+fmt(audio.duration);
  if(audio.duration)document.getElementById("seek").value=(audio.currentTime/audio.duration)*100;
  if(++tick%4===0){save();highlight();}
});
function highlight(){
  const sec=DATA.sections[index];if(!sec)return;
  let cur=-1;for(let k=0;k<sec.items.length;k++){if(audio.currentTime>=sec.items[k].start)cur=k;else break;}
  document.querySelectorAll(".ti.live").forEach(e=>e.classList.remove("live"));
  if(cur>=0){const el=document.querySelector('.ti[data-sec="'+index+'"][data-i="'+cur+'"]');
    if(el){el.classList.add("live");}}
}
audio.addEventListener("loadedmetadata",()=>{
  if(index>=0)document.getElementById("meta"+index).textContent=DATA.sections[index].count+" 条 · "+fmt(audio.duration);
});
audio.addEventListener("pause",save);
document.getElementById("playAll").onclick=()=>play(0,true);
document.getElementById("toggle").onclick=()=>{
  if(index<0){play(0,true);return}
  if(audio.paused){audio.play();document.getElementById("toggle").textContent="⏸"}
  else{audio.pause();document.getElementById("toggle").textContent="▶"}
};
document.getElementById("prev").onclick=()=>{if(index>0)play(index-1,allMode)};
document.getElementById("next").onclick=()=>{if(index+1<DATA.sections.length)play(index+1,allMode)};
document.getElementById("seek").oninput=e=>{if(audio.duration)audio.currentTime=audio.duration*e.target.value/100};
document.getElementById("resumeBtn").onclick=()=>{const s=saved();if(s){play(s.i,true);audio.currentTime=s.t||0;document.getElementById("resume").style.display="none";}};
document.getElementById("forgetBtn").onclick=()=>{localStorage.removeItem(KEY);document.getElementById("resume").style.display="none";play(0,true)};
(function(){const s=saved();if(s&&s.i<DATA.sections.length){
  document.getElementById("resumeText").innerHTML="上次听到 <b>"+DATA.sections[s.i].emoji+" "
    +DATA.sections[s.i].name+"</b> 的 "+fmt(s.t)+" 处";
  document.getElementById("resume").style.display="block";}})();
(function(){const h=(location.hash||"").replace("#","");if(!h)return;
  const i=DATA.sections.findIndex(s=>s.key===h);if(i>=0)play(i,false);})();
</script></body></html>
